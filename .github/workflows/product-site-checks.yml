name: product-site-checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the committed Wrangler dependency set
        run: npm ci --ignore-scripts --prefix infra/cloudflare/control-plane
      - name: Check the brochure and preview the deployment without publishing
        run: make check-product-site
