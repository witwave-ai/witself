name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Main pushes must finish independently: a docs or brochure run does not replace
  # application coverage from an earlier merge. PR updates still supersede runs.
  group: ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      application: ${{ steps.scope.outputs.application }}
      docs: ${{ steps.scope.outputs.docs }}
      docs_index: ${{ steps.scope.outputs.docs_index }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      website: ${{ steps.scope.outputs.website }}
      website_only: ${{ steps.scope.outputs.website_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Look up the declared PR test merge
        id: merge-ref
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merge_sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.merge_commit_sha // empty' 2>/dev/null) || merge_sha=''
          if [[ ! "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then merge_sha=''; fi
          printf 'merge_sha=%s\n' "$merge_sha" >> "$GITHUB_OUTPUT"
      - name: Test change classification and required gates
        run: node --test scripts/ci-product-scope.test.mjs scripts/ci-product-gate.test.mjs scripts/ci-product-workflow.test.mjs scripts/check-docs.test.mjs scripts/run-docs-check.test.mjs
      - name: Classify the complete change set
        id: scope
        env:
          WITSELF_CI_PR_MERGE_SHA: ${{ steps.merge-ref.outputs.merge_sha }}
        run: node scripts/ci-product-scope.mjs

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/product-site-checks.yml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.docs_index == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Validate documentation
        run: make check-docs

  # Keep every required check reporting a real result in every lane. Application
  # and shared changes retain the full gates mirrored by the release workflow.
  go:
    name: go
    if: ${{ always() }}
    needs: [changes, website, docs, go-rest, go-store, go-capture-principals, go-capture-mixed, go-infra, localcell-windows, localcell-unix, postgres-backup-image, postgres-image-mirror, provider-contract-evidence, static-analysis]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Require scoped CI gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-product-gate.mjs

  release-config:
    if: ${{ always() }}
    needs: [changes, website, docs, release-config-full]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Require scoped CI gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-product-gate.mjs

  homebrew-formula:
    if: ${{ always() }}
    needs: [changes, website, docs, homebrew-formula-full]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Require scoped CI gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-product-gate.mjs

  helm:
    if: ${{ always() }}
    needs: [changes, website, docs, helm-full]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Require scoped CI gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-product-gate.mjs

  # Frozen required names: these labels identify checks, not their runners.
  avatar-renderer-portability:
    name: avatar-renderer-portability (${{ matrix.check }})
    if: ${{ always() }}
    needs: [changes, website, docs, avatar-renderer-portability-full]
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: ubuntu-latest
            runner: ubuntu-24.04
          - check: ubuntu-24.04-arm
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Require scoped CI gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-product-gate.mjs

  # Unit coverage, pinned PostgreSQL 16 provisioning, native lifecycle proof, and cleanup.
  localcell-windows:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build Local Cell packages
        shell: pwsh
        run: go build ./cmd/witself-server ./cmd/witself-worker ./internal/localcell/... ./internal/tools/localcellharness/... ./internal/runtimeconfig/...
      - name: Vet Local Cell packages
        shell: pwsh
        run: go vet ./cmd/witself-server ./cmd/witself-worker ./internal/localcell/... ./internal/tools/localcellharness/... ./internal/runtimeconfig/...
      - name: Test Go JSON result checker
        shell: pwsh
        run: node --test scripts/ci-go-test-json-check.test.mjs
      - name: Test Local Cell packages and require complete results
        shell: pwsh
        run: |
          $goExit = 1
          & {
            go test -json ./internal/localcell ./internal/runtimeconfig ./internal/tools/localcellharness -count=1 -timeout=20m
            $script:goExit = $LASTEXITCODE
          } | node scripts/ci-go-test-json-check.mjs
          $parserExit = $LASTEXITCODE
          if ($goExit -ne 0 -or $parserExit -ne 0) { exit 1 }
      - name: Provision pinned PostgreSQL sixteen
        shell: pwsh
        run: ./scripts/ci-postgres16-windows.ps1
      - name: Prove native PostgreSQL sixteen lifecycle
        shell: pwsh
        env:
          WITSELF_LOCALCELL_PGBIN: ${{ runner.temp }}\lc-pg16\pgsql\bin
          TEMP: ${{ runner.temp }}\lc-pg16\testtmp
          TMP: ${{ runner.temp }}\lc-pg16\testtmp
        run: |
          $proofJSON = Join-Path $env:RUNNER_TEMP 'lc-pg16\proof.json'
          go test -json ./internal/localcell -run '^TestRealLifecycle$' -count=1 -timeout=15m > $proofJSON 2>&1
          $goExit = $LASTEXITCODE
          node scripts/ci-go-test-json-check.mjs --input $proofJSON --diagnose --require TestRealLifecycle,TestRealLifecycle/InstallStartRestartRemove,TestRealLifecycle/TwoCellsAreIndependent,TestRealLifecycle/InterruptedStartRepair,TestRealLifecycle/WaitsForReadiness,TestRealLifecycle/InstallerPrincipals,TestRealLifecycle/RetainedReinstall,TestRealLifecycle/Checkpoint
          $parserExit = $LASTEXITCODE
          if ($goExit -ne 0 -or $parserExit -ne 0) { exit 1 }
      - name: Prove native service restart or record adapter capability
        shell: pwsh
        env:
          WITSELF_LOCALCELL_SERVICE_ADAPTER: windows-logon-task
          WITSELF_LOCALCELL_PGBIN: ${{ runner.temp }}\lc-pg16\pgsql\bin
          TEMP: ${{ runner.temp }}\lc-pg16\testtmp
          TMP: ${{ runner.temp }}\lc-pg16\testtmp
        run: |
          $proofJSON = Join-Path $env:RUNNER_TEMP 'lc-pg16\service-proof.json'
          go test -json ./internal/localcell -run '^TestNativeServiceLifecycle$' -count=1 -timeout=15m > $proofJSON 2>&1
          $goExit = $LASTEXITCODE
          node scripts/ci-go-test-json-check.mjs --input $proofJSON --diagnose --manager-required --require TestNativeServiceLifecycle,service_shutdown_channel
          $parserExit = $LASTEXITCODE
          # The checker prints successful capability outcomes only. Project the
          # fixed boot diagnostic fields so successful native rounds retain them.
          Get-Content -LiteralPath $proofJSON | ForEach-Object {
            try { $event = $_ | ConvertFrom-Json -ErrorAction Stop } catch { return }
            if ($event.Action -eq 'output' -and $event.Test -eq 'TestNativeServiceLifecycle' -and
                $event.Output -cmatch '^\s*service_native(?:_diagnostics)?_test\.go:[0-9]+: (service_boot_identity ntstatus=0x[0-9a-f]{8} length=[0-9]{1,10} guid_nonzero=(?:true|false))\r?\n$') {
              Write-Output $Matches[1]
            }
          }
          if ($goExit -ne 0 -or $parserExit -ne 0) { exit 1 }
      - name: Clean PostgreSQL proof tree
        if: always()
        shell: pwsh
        run: ./scripts/ci-postgres16-windows.ps1 -Cleanup

  # The same required lifecycle protocol runs natively on each supported Unix row.
  localcell-unix:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build Local Cell packages
        shell: bash
        run: go build ./cmd/witself-server ./cmd/witself-worker ./internal/localcell/... ./internal/tools/localcellharness/... ./internal/runtimeconfig/...
      - name: Vet Local Cell packages
        shell: bash
        run: go vet ./cmd/witself-server ./cmd/witself-worker ./internal/localcell/... ./internal/tools/localcellharness/... ./internal/runtimeconfig/...
      - name: Test Go JSON result checker
        shell: bash
        run: node --test scripts/ci-go-test-json-check.test.mjs
      - name: Test Local Cell packages and require complete results
        shell: bash
        run: |
          set +e
          go test -json ./internal/localcell ./internal/runtimeconfig ./internal/tools/localcellharness -count=1 -timeout=20m | node scripts/ci-go-test-json-check.mjs
          test_exits=("${PIPESTATUS[@]}")
          set -e
          if (( test_exits[0] != 0 || test_exits[1] != 0 )); then exit 1; fi
      - name: Provision pinned PostgreSQL sixteen
        shell: bash
        run: bash scripts/ci-postgres16-unix.sh '${{ matrix.platform }}'
      - name: Prove native PostgreSQL sixteen lifecycle
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/lc-pg16/testtmp
        run: |
          proof_json="$RUNNER_TEMP/lc-pg16/proof.json"
          go_exit=0
          go test -json ./internal/localcell -run '^TestRealLifecycle$' -count=1 -timeout=15m > "$proof_json" 2>&1 || go_exit=$?
          parser_exit=0
          node scripts/ci-go-test-json-check.mjs --input "$proof_json" --diagnose --require TestRealLifecycle,TestRealLifecycle/InstallStartRestartRemove,TestRealLifecycle/TwoCellsAreIndependent,TestRealLifecycle/InterruptedStartRepair,TestRealLifecycle/WaitsForReadiness,TestRealLifecycle/InstallerPrincipals,TestRealLifecycle/RetainedReinstall,TestRealLifecycle/Checkpoint || parser_exit=$?
          if (( go_exit != 0 || parser_exit != 0 )); then exit 1; fi
      - name: Prove native service restart or record adapter capability
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/lc-pg16/testtmp
        run: |
          proof_json="$RUNNER_TEMP/lc-pg16/service-proof.json"
          go_exit=0
          go test -json ./internal/localcell -run '^TestNativeServiceLifecycle$' -count=1 -timeout=15m > "$proof_json" 2>&1 || go_exit=$?
          parser_exit=0
          node scripts/ci-go-test-json-check.mjs --input "$proof_json" --diagnose --require TestNativeServiceLifecycle || parser_exit=$?
          if (( go_exit != 0 || parser_exit != 0 )); then exit 1; fi
      - name: Clean PostgreSQL proof tree
        if: always()
        shell: bash
        run: bash scripts/ci-postgres16-unix.sh --cleanup

  go-rest:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      # Command packages may carry database-backed call-site tests (the
      # serving startup cohort check is the first). They create their own
      # schema, so they do not collide with the store job's database.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: witself
          POSTGRES_PASSWORD: witself
          POSTGRES_DB: witself
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U witself -d witself"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: go mod tidy
        run: go mod tidy -diff

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet signup acceptance driver
        run: go vet -tags signup_b2_acceptance ./cmd/witself/

      - name: build
        run: go build ./...

      - name: test non-store
        shell: bash
        env:
          WITSELF_TEST_DATABASE_URL: postgres://witself:witself@localhost:5432/witself?sslmode=disable
          WITSELF_TEST_REQUIRE_DATABASE: "1"
          WITSELF_TEST_REQUIRE_NODE: "1"
          WITSELF_TEST_REQUIRE_OPENSSL: "1"
          WITSELF_TEST_REQUIRE_BOOTSTRAP_PARITY: "1"
        run: |
          # Keep package discovery in a checked pipeline: a failed go list
          # must fail this gate, not leave a partial package list to test.
          go list ./... | grep -vE '/internal/store(/|$)' > "$RUNNER_TEMP/go-test-packages.txt"
          mapfile -t packages < "$RUNNER_TEMP/go-test-packages.txt"
          go test "${packages[@]}" \
            -race \
            -shuffle=on \
            -timeout=30m \
            -covermode=atomic \
            -coverprofile="$RUNNER_TEMP/go-coverage-rest.out"
          go tool cover -func="$RUNNER_TEMP/go-coverage-rest.out"

      - name: Upload Go non-store coverage
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: go-coverage-rest
          path: ${{ runner.temp }}/go-coverage-rest.out
          if-no-files-found: error

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run ./...
          # Keep Windows scope aligned with the check recipe in Makefile.
          GOOS=windows GOARCH=amd64 golangci-lint run ./internal/localcell/... ./internal/dashboard/... ./internal/listenerdiagnostic/... ./internal/memorycurator/... ./internal/memoryhydration/... ./internal/runtimeconfig/... ./internal/tools/capturemix/... ./internal/tools/localcellharness/...

      - name: Cloudflare agent-email Worker gates
        run: |
          npm --prefix infra/cloudflare/agent-email ci
          npm --prefix infra/cloudflare/agent-email test
          npm --prefix infra/cloudflare/agent-email run bundle:check

      - name: Cloudflare agent-email sending adapter gates
        run: |
          npm --prefix infra/cloudflare/agent-email-send ci
          npm --prefix infra/cloudflare/agent-email-send test
          npm --prefix infra/cloudflare/agent-email-send run bundle:check

      - name: Cloudflare support-email-intake Worker gates
        run: |
          npm --prefix infra/cloudflare/support-email-intake ci
          npm --prefix infra/cloudflare/support-email-intake test
          npm --prefix infra/cloudflare/support-email-intake run bundle:check

      - name: Cloudflare control-plane Worker gates
        run: |
          npm --prefix infra/cloudflare/control-plane ci
          npm --prefix infra/cloudflare/control-plane test
          npm --prefix infra/cloudflare/control-plane run bundle:check

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  go-capture-principals:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: witself
          POSTGRES_PASSWORD: witself
          POSTGRES_DB: witself
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U witself -d witself"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GOTOOLCHAIN: local
      WITSELF_TEST_DATABASE_URL: postgres://witself:witself@localhost:5432/witself?sslmode=disable
      WITSELF_TEST_DISPOSABLE_CLUSTER: "1"
      WITSELF_TEST_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Warm the module cache so download notices never enter the proof stream
        run: go mod download
      - name: Test principal proof result checker
        run: node --test scripts/ci-go-test-json-check.test.mjs
      - name: Prove isolated capture principal topology and denials
        shell: bash
        run: |
          proof_json="$RUNNER_TEMP/capture-principals.json"
          go_exit=0
          go test -json ./internal/store -run 'SyncPrincipal' -count=1 -timeout=25m > "$proof_json" 2>&1 || go_exit=$?
          parser_exit=0
          node scripts/ci-go-test-json-check.mjs --input "$proof_json" --diagnose --package github.com/witwave-ai/witself/internal/store --require TestSyncPrincipalSeparation,TestSyncPrincipalBypassDenied,TestSyncPrincipalDowngradeDenied,TestSyncPrincipalCapabilityRevocation,TestSyncPrincipalActivationTopology || parser_exit=$?
          if (( go_exit != 0 || parser_exit != 0 )); then exit 1; fi

  go-capture-mixed:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: witself
          POSTGRES_PASSWORD: witself
          POSTGRES_DB: witself
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U witself -d witself"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GOTOOLCHAIN: local
      WITSELF_TEST_DATABASE_URL: postgres://witself:witself@localhost:5432/witself?sslmode=disable
      WITSELF_TEST_DISPOSABLE_CLUSTER: "1"
      WITSELF_TEST_REQUIRE_DATABASE: "1"
      WITSELF_CAPTUREMIX_CURRENT_BIN_DIR: ${{ github.workspace }}/current/bin
      WITSELF_CAPTUREMIX_PREDECESSOR_BIN_DIR: ${{ github.workspace }}/predecessor/bin
      WITSELF_CAPTUREMIX_PREDECESSOR_COMMIT_FILE: ${{ github.workspace }}/predecessor/PREDECESSOR_COMMIT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the reviewed immutable predecessor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 2f1c194398c5df943c305b8e11c9ab32db0e7f3e
          path: predecessor
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Warm the module cache so download notices never enter the proof stream
        run: go mod download
      - name: Warm the predecessor module cache from its own module
        working-directory: predecessor
        run: go mod download
      - name: Build the predecessor with its own module and toolchain selection
        working-directory: predecessor
        shell: bash
        run: |
          mkdir -p bin
          git rev-parse HEAD > PREDECESSOR_COMMIT
          go build -o bin/witself-server ./cmd/witself-server
          go build -o bin/witself-worker ./cmd/witself-worker
      - name: Build the current executables separately
        shell: bash
        run: |
          mkdir -p current/bin
          go build -o current/bin/witself-server ./cmd/witself-server
          go build -o current/bin/witself-worker ./cmd/witself-worker
      - name: Record private executable build identities
        env:
          WITSELF_CAPTUREMIX_ARTIFACT_DIR: ${{ runner.temp }}/capture-mixed-artifacts
        shell: bash
        run: |
          mkdir -p "$WITSELF_CAPTUREMIX_ARTIFACT_DIR"
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          records = {'predecessor_commit': pathlib.Path('predecessor/PREDECESSOR_COMMIT').read_text().strip(), 'binaries': {}}
          for generation in ('current', 'predecessor'):
              for command in ('witself-server', 'witself-worker'):
                  binary = pathlib.Path(generation, 'bin', command)
                  version = subprocess.check_output(['go', 'version', str(binary)], text=True).split()[-1]
                  records['binaries'][generation + '_' + command] = {
                      'digest': hashlib.sha256(binary.read_bytes()).hexdigest(),
                      'go_version': version, 'goos': 'linux', 'goarch': 'amd64'}
          target = pathlib.Path(os.environ['WITSELF_CAPTUREMIX_ARTIFACT_DIR'], 'build-identities.json')
          target.write_text(json.dumps(records, sort_keys=True) + '\n')
          target.chmod(0o600)
          PYCODE
          printf '%s\n' 'predecessor build identity recorded'
      - name: Test mixed proof result checker
        run: node --test scripts/ci-go-test-json-check.test.mjs
      - name: Prove the isolated mixed executable capture matrix
        env:
          WITSELF_CAPTUREMIX_ARTIFACT_DIR: ${{ runner.temp }}/capture-mixed-artifacts
        shell: bash
        run: |
          proof_json="$RUNNER_TEMP/capture-mixed.json"
          go_exit=0
          go test -json ./internal/store -run 'CaptureMix' -count=1 -timeout=25m > "$proof_json" 2>&1 || go_exit=$?
          parser_exit=0
          node scripts/ci-go-test-json-check.mjs --input "$proof_json" --diagnose --package github.com/witwave-ai/witself/internal/store --require TestCaptureMixMatrix || parser_exit=$?
          if (( go_exit != 0 || parser_exit != 0 )); then exit 1; fi

      - name: Retain private mixed build identity and value-free stub requests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: capture-mixed-evidence
          path: ${{ runner.temp }}/capture-mixed-artifacts
          if-no-files-found: error

  go-store:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: witself
          POSTGRES_PASSWORD: witself
          POSTGRES_DB: witself
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U witself -d witself"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Keep the production-backed store tests in the normal CI gate. Without
      # this DSN they intentionally skip, which can hide PostgreSQL semantics.
      WITSELF_TEST_DATABASE_URL: postgres://witself:witself@localhost:5432/witself?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: test store
        # The PostgreSQL integration suite deliberately serializes schema
        # migrations behind one advisory lock. Keep a bounded margin for
        # the lock queue even though this suite now has its own runner. The
        # synthetic sync harness (LC-S5) adds real-PostgreSQL lock-observation
        # tests; the job took 39.6 min at LC-S5C under the former 45m limit.
        env:
          WITSELF_TEST_REQUIRE_DATABASE: "1"
          WITSELF_TEST_REQUIRE_NODE: "1"
        run: |
          go test ./internal/store/... \
            -race \
            -shuffle=on \
            -timeout=60m \
            -covermode=atomic \
            -coverprofile="$RUNNER_TEMP/go-coverage-store.out"
          go tool cover -func="$RUNNER_TEMP/go-coverage-store.out"

      - name: test import peak memory (no race)
        env:
          WITSELF_TEST_REQUIRE_PEAK_MEMORY: "1"
        run: go test ./internal/store -run '^TestImportPeakMemory$' -count=1 -v -timeout=15m

      - name: test archive reader peak memory (no race)
        env:
          WITSELF_TEST_REQUIRE_PEAK_MEMORY: "1"
        run: go test ./internal/export -run '^TestReadPeakMemory$' -count=1 -v -timeout=15m
      - name: test import state memory (no race)
        env:
          WITSELF_TEST_REQUIRE_PEAK_MEMORY: "1"
          WITSELF_TEST_REQUIRE_DATABASE: "1"
        run: go test ./internal/store -run '^(TestImportEntryIndexBytes|TestImportStateMemoryPostgres)$' -count=1 -v -timeout=40m

      - name: Upload Go store coverage
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: go-coverage-store
          path: ${{ runner.temp }}/go-coverage-store.out
          if-no-files-found: error

  go-infra:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infra/pulumi/go.mod
          cache: true
          cache-dependency-path: infra/pulumi/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: go mod tidy
        run: cd infra/pulumi && go mod tidy -diff

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      # infra/pulumi is a NESTED module: ./... from the repo root never
      # descends into it, so without this step its tests run nowhere.
      - name: infra module gates
        run: |
          cd infra/pulumi
          go vet ./...
          go build ./...
          go test ./...
          golangci-lint run ./...

  postgres-backup-image:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Build and smoke-test pinned backup image on AMD64 and ARM64
        env:
          CI: "true"
        run: make check-postgres-backup-image

  postgres-image-mirror:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install digest-preserving registry copier
        # Ubuntu 24.04 ships Skopeo 1.13.3. The helper also rejects < 1.5,
        # which cannot enforce --preserve-digests, if the pinned image changes.
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Verify PostgreSQL upstream copies before tagging
        env:
          CI: "true"
        run: make check-postgres-image-mirror

  release-config-full:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Pin both the action wrapper and the binary: release configuration is a
      # production interface, so upgrades should arrive as reviewed changes.
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.17.0
          install-only: true

      - name: Validate GoReleaser configuration
        run: goreleaser check

      - name: Validate derived Witself CLI smoke configuration
        run: |
          scripts/render-goreleaser-witself-smoke-config.sh "$RUNNER_TEMP/goreleaser-witself-smoke.yaml" .goreleaser.yaml
          goreleaser check -f "$RUNNER_TEMP/goreleaser-witself-smoke.yaml"

      - name: Test control-plane release artifact contract
        run: bash scripts/test-control-plane-release-artifact.sh

      - name: Test complete release asset-count contract
        run: bash scripts/test-release-artifact-contract.sh

      - name: Test provider evidence workflow contract
        run: bash scripts/test-provider-contract-workflow.sh

      - name: Test Homebrew tap publisher
        run: bash scripts/test-publish-homebrew-formulas.sh

      - name: Test GHCR latest reconciliation
        run: bash scripts/test-promote-latest-images.sh

  static-analysis:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pin and run ShellCheck and actionlint
        run: bash scripts/test-ci-static-analysis.sh

  homebrew-formula-full:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Render and audit Homebrew formulae
        run: bash scripts/test-homebrew-formulas.sh

  # Prove the provider installation transaction on every native platform we
  # advertise. These tests use a portable fake runtime and disposable homes;
  # they need no vendor account and never touch a developer's real profile.
  # Retained fixture evidence does not establish real-client/model acceptance;
  # those separate gates are documented in provider-integration-certification.
  provider-integration-contract:
    name: provider integration / ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.application == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-intel
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Record native target
        run: go env GOOS GOARCH

      - name: Component-set bootstrap parity and remote-only archive boundary
        env:
          WITSELF_TEST_REQUIRE_OPENSSL: "1"
          WITSELF_TEST_REQUIRE_BOOTSTRAP_PARITY: "1"
        run: go test ./internal/localcell/trust/... -count=1

      - name: Native private generation owner proof
        id: trust_native_proof
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 40
        run: |
          go run ./tools/trust-native-proof --output (Join-Path $env:RUNNER_TEMP "trust-native-proof-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json")
          exit $LASTEXITCODE

      - name: Upload native private generation proof receipt
        if: ${{ always() && runner.os == 'Windows' && steps.trust_native_proof.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trust-native-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trust-native-proof-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error

      - name: Build native Witself client
        shell: bash
        run: |
          executable_suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then executable_suffix=".exe"; fi
          go build -o "$RUNNER_TEMP/witself-native-smoke$executable_suffix" ./cmd/witself

      - name: Install GoReleaser for exact client artifact gate
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.17.0
          install-only: true

      - name: Derive CLI-only smoke config from release config
        shell: bash
        run: >-
          scripts/render-goreleaser-witself-smoke-config.sh
          "$RUNNER_TEMP/goreleaser-witself-smoke.yaml"
          .goreleaser.yaml

      - name: Build exact GoReleaser Unix archive and checksums
        if: runner.os != 'Windows'
        shell: bash
        run: |
          goreleaser release \
            --config "$RUNNER_TEMP/goreleaser-witself-smoke.yaml" \
            --snapshot \
            --clean \
            --skip=before,sign,sbom,docker \
            --parallelism 1 \
            --timeout 30m

      - name: Build exact GoReleaser Windows archive
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'goreleaser-witself-smoke.yaml'
          & goreleaser release --config $config --snapshot --clean '--skip=before,sign,sbom,docker' --parallelism 1 --timeout 30m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Universal installer artifact smoke
        if: runner.os != 'Windows'
        env:
          WITSELF_INSTALL_SMOKE_GORELEASER_DIST: ${{ github.workspace }}/dist
          WITSELF_INSTALL_SMOKE_OUTPUT: ${{ runner.temp }}/witself-installed
        run: bash scripts/test-install-unix.sh

      - name: Windows binary installer smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          .\scripts\test-install-windows.ps1
          -GoReleaserDist .\dist
          -InstalledBinaryOutput "$env:RUNNER_TEMP\witself-installed.exe"

      - name: PowerShell static analysis
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test-powershell-static-analysis.ps1

      - name: Native platform safety primitives
        run: >-
          go test
          ./internal/local
          ./internal/memorycurator
          ./internal/dashboard
          ./internal/transcriptcapture
          -run '^(TestLocalLockFile|TestAutoLockPlatform|TestAutoLockIdentity|TestRegistryClaimLock|TestPIDRunning|TestCapturePlatform|TestReplaceFileAtomic)'
          -count=1

      - name: Native signup journal and recovery
        if: runner.os == 'Windows'
        run: >-
          go test -json ./internal/local ./cmd/witself
          -run '^(TestWindowsAccountProvisionJournalSyncBoundary|TestAccountProvisionJournalLifecycle|TestAccountProvisionBeginResyncsAmbiguousPromotionBeforeReturningCandidate|TestAccountCreateResumesAmbiguousProvisionWithSameID|TestAccountCreateSuccessfulSuccessorSavesCredentialAndRecoversOffline|TestAccountCreatePendingReconsentRequiresDurabilityBeforeRemoteRegistration|TestAccountProvisionWindowsPrivateCreationBeforeWrite|TestAccountProvisionWindowsPrivateDescriptorPolicy|TestAccountProvisionWindowsPrivateHandleRejectsUnsafeACLWithoutRepair|TestAccountProvisionWindowsPrivateCreationPreservesExistingObjects|TestAccountProvisionWindowsPrivateHandleIdentityFences|TestAccountProvisionWindowsPrivateHandleRejectsReparsePath|TestWindowsAccountProvisionMissingParentRefusesWithoutMutation|TestWindowsAccountProvisionReparseParentRefusesWithoutMutation|TestWindowsAccountProvisionUnsafeExistingHomeIsNotRepaired|TestWindowsAccountProvisionFixedAnchorDurabilityReplay|TestWindowsAccountProvisionExistingLockReestablishesPublication|TestWindowsAccountProvisionTemporaryDeletionBindsIdentity|TestWindowsAccountProvisionRetainedAncestorsBlockReplacement|TestWindowsAccountProvisionAvailabilityRejectsUnsafeConfigWithoutRepair|TestWindowsAccountProvisionTemporaryCreationIsPrivateBeforeWrite)$'
          -count=1

      - name: Native agent terminal and web console lifecycle
        run: >-
          go test ./cmd/witself ./internal/agenttui ./internal/dashboard
          -run '^(TestTUIConsole|TestAgentTUI|TestConsole|TestRegistryInstance|TestReleaseRegistryInstance|TestClaimManagedRegistryEntry)'
          -count=1 -timeout=5m

      - name: Managed instruction platform primitives
        run: >-
          go test ./cmd/witself
          -run '^(TestManagedInstructionExchangePrimitive|TestManagedInstructionNoReplacePrimitive|TestManagedInstructionDerivedTempPatterns|TestWindowsManagedInstruction|TestWindowsIntegrationTransactionSyncPrimitives)'
          -count=1

      - name: Codex Windows hook contract
        run: >-
          go test ./internal/transcriptcapture
          -run '^TestCodexHooksWindows'
          -count=1

      - name: Run provider contracts and retain sanitized outcomes
        shell: bash
        env:
          PROVIDER_TARGET: ${{ matrix.target }}
        run: |
          executable_suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then executable_suffix=".exe"; fi
          reporter="$RUNNER_TEMP/provider-contract-evidence$executable_suffix"
          go build -o "$reporter" ./tools/provider-contract-evidence
          release_tag=""
          "$reporter" run \
            --output "$RUNNER_TEMP/provider-contract-$PROVIDER_TARGET.json" \
            --target "$PROVIDER_TARGET" \
            --expected-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --workflow ci \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-ref "$GITHUB_REF" --release-tag "$release_tag" \
            --binary "$RUNNER_TEMP/witself-installed$executable_suffix" --dist dist

      - name: Upload sanitized provider cell
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: provider-contract-cell-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-contract-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 90

  provider-contract-evidence:
    needs: [changes, provider-integration-contract]
    if: always() && needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every native provider job
        env:
          NATIVE_RESULT: ${{ needs.provider-integration-contract.result }}
        run: test "$NATIVE_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download this attempt's provider cells
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: provider-contract-cell-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-contract-cells
          merge-multiple: false
          digest-mismatch: error

      - name: Validate complete provider matrix
        run: |
          release_tag=""
          go run ./tools/provider-contract-evidence aggregate \
            --input-dir "$RUNNER_TEMP/provider-contract-cells" \
            --output "$RUNNER_TEMP/provider-contract-evidence.json" \
            --markdown "$RUNNER_TEMP/provider-contract-evidence.md" \
            --expected-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --workflow ci \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-ref "$GITHUB_REF" --release-tag "$release_tag"
          cat "$RUNNER_TEMP/provider-contract-evidence.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated provider matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: provider-contract-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-contract-evidence.json
          if-no-files-found: error
          retention-days: 90

  # Keep both native renderer architectures in the application lane. The
  # lightweight wrappers above preserve their existing required check names.
  avatar-renderer-portability-full:
    name: avatar renderer full (${{ matrix.check }})
    needs: changes
    if: needs.changes.outputs.application == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: ubuntu-latest
            runner: ubuntu-24.04
          - check: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: renderer architecture
        run: go env GOOS GOARCH

      - name: avatar renderer portability goldens
        run: >-
          go test ./internal/avatar
          -run
          '^TestPerceptual(V1PolicyGolden|Continuity.*Golden.*|ContinuityFingerprintSpeciesAndPlaceholderBehavior)$'
          -count=1

  helm-full:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.16.4

      - name: install kubeconform
        timeout-minutes: 4
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_LINUX_AMD64_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -fsSLO --retry 3 --retry-all-errors --retry-delay 1 \
            --connect-timeout 10 --max-time 60 --retry-max-time 120 \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_LINUX_AMD64_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo install kubeconform /usr/local/bin/

      - name: helm lint
        run: |
          helm lint .gitops/charts/platform
          helm lint .gitops/charts/platform --values .gitops/charts/platform/ci/monitoring-values.yaml
          helm lint .gitops/charts/apps
          helm lint charts/witself-server
          helm lint charts/witself-server --values charts/witself-server/ci/cloud-values.yaml
          helm lint charts/witself-server --values charts/witself-server/ci/gcp-rollout-values.yaml

      - name: rollout rendering checks
        run: bash scripts/test-helm-rollout.sh

      - name: Install pinned cell Secret tools
        run: |
          go install github.com/getsops/sops/v3/cmd/sops@v3.13.3
          go install filippo.io/age/cmd/age@v1.3.2
          go install filippo.io/age/cmd/age-keygen@v1.3.2
          ruby -e 'require "json"; require "yaml"; require "open3"'

      - name: Cell Secret ciphertext and offline round-trip checks
        run: |
          make check-cell-secrets
          bash scripts/test-cell-secrets.sh
          bash scripts/test-copy-cell-secrets.sh

      - name: gitops cell values drift check
        run: |
          bash scripts/gitops-cell-values.sh --check
          bash scripts/test-gitops-cell-values.sh

      - name: Fetch PostgreSQL child chart
        timeout-minutes: 4
        run: |
          chart=$(bash scripts/fetch-test-postgresql-chart.sh)
          printf 'WITSELF_TEST_POSTGRESQL_CHART=%s\n' "$chart" >> "$GITHUB_ENV"

      - name: PostgreSQL child chart fetch contract checks
        run: bash scripts/test-fetch-test-postgresql-chart.sh

      - name: cell roll state contract checks
        timeout-minutes: 20
        run: bash scripts/test-cell-roll-states.sh

      - name: roll cell backup gate checks
        run: bash scripts/test-roll-cell-gate.sh

      - name: roll train offline contract checks
        timeout-minutes: 10
        run: bash scripts/test-roll-train.sh
      - name: release operations offline contract checks
        timeout-minutes: 10
        run: bash scripts/test-release-ops.sh

      - name: migration rehearsal offline contract checks
        timeout-minutes: 10
        run: bash scripts/test-rehearse-store-migrations.sh

      - name: memory load quality workflow contract checks
        run: bash scripts/test-memory-load-quality-workflow.sh
      - name: hosted runner image and required check name contract checks
        run: bash scripts/test-workflow-runner-labels.sh
      - name: security scan offline contract checks
        timeout-minutes: 5
        run: bash scripts/test-security-scan.sh
      - name: security scan image offline contract checks
        timeout-minutes: 5
        run: bash scripts/test-security-scan-images.sh
      - name: security scan issue offline contract checks
        timeout-minutes: 5
        run: bash scripts/test-security-scan-issue.sh
      - name: security scan workflow contract checks
        timeout-minutes: 5
        run: bash scripts/test-security-scan-workflow.sh

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/witself/test-assets
          key: monitoring-test-assets-${{ runner.os }}-${{ hashFiles('scripts/testdata/monitoring-test-assets.pins') }}

      - name: Fetch monitoring test assets
        timeout-minutes: 6
        run: |
          assets=$(bash scripts/fetch-monitoring-test-assets.sh)
          printf 'WITSELF_MONITORING_TEST_ASSETS=%s\n' "$assets" >> "$GITHUB_ENV"

      - name: monitoring test asset fetch contract checks
        run: bash scripts/test-fetch-monitoring-test-assets.sh

      - name: monitoring rollout capability checks
        run: |
          bash scripts/test-monitoring-rollout.sh
          bash scripts/test-monitoring-alert-canary.sh

      - name: avatar acceptance offline contract checks
        run: bash scripts/test-avatar-acceptance.sh

      - name: collaboration canary offline contract checks
        timeout-minutes: 10
        run: bash scripts/test-collaboration-canary.sh

      - name: billing transition rollout preflight checks
        run: bash scripts/test-billing-transition-rollout-preflight.sh

      - name: billing rollout inventory capture checks
        run: bash scripts/test-capture-billing-rollout-inventory.sh

      - name: agent-email isolated cell operation checks
        run: bash scripts/test-agent-email-cell-operation.sh

      - name: agent-email transient receipt proof checks
        run: bash scripts/test-agent-email-receipt-proof.sh

      - name: agent-email receive smoke harness checks
        run: bash scripts/test-agent-email-cell-smoke.sh

      - name: helm template + kubeconform
        run: |
          for v in "" "ci/self-hosted-values.yaml" "ci/cloud-values.yaml" "ci/gcp-rollout-values.yaml"; do
            args=(); label=default
            if [ -n "$v" ]; then args=(--values "charts/witself-server/$v"); label="$v"; fi
            echo "::group::$label"
            helm template r charts/witself-server "${args[@]}" -n witself | kubeconform -strict -ignore-missing-schemas -summary
            echo "::endgroup::"
          done
