name: product-screenshots

on:
  pull_request:
    paths:
      - 'internal/agenttui/**'
      - 'internal/dashboard/**'
      - 'web/product/screenshots/**'
      - 'web/product/assets/screenshots/**'
      - 'scripts/dashboard-acceptance/package*.json'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/product-screenshots.yml'
  push:
    branches: [main]
    paths:
      - 'internal/agenttui/**'
      - 'internal/dashboard/**'
      - 'web/product/screenshots/**'
      - 'web/product/assets/screenshots/**'
      - 'scripts/dashboard-acceptance/package*.json'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/product-screenshots.yml'
  workflow_dispatch:

# This workflow produces review candidates. It cannot commit or publish them.
permissions:
  contents: read

concurrency:
  group: product-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked capture tools
        run: |
          npm ci --ignore-scripts --prefix scripts/dashboard-acceptance
          npm ci --ignore-scripts --prefix web/product/screenshots
          node scripts/dashboard-acceptance/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check the isolated capture helper
        run: |
          go test ./web/product/screenshots/demo
          node --test web/product/screenshots/verify.test.mjs
      - name: Capture current UI with synthetic demo data
        run: node web/product/screenshots/capture.mjs --out "$RUNNER_TEMP/product-screenshots"
      - name: Retain fresh candidates for visual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: product-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/product-screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Require brochure images to match current source inputs
        run: node web/product/screenshots/verify.mjs
