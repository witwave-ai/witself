name: product-site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current main commit after website validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: product-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      website: ${{ steps.scope.outputs.website }}
      website_only: ${{ steps.scope.outputs.website_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test change classification and required gates
        run: node --test scripts/ci-product-scope.test.mjs scripts/ci-product-gate.test.mjs scripts/ci-product-workflow.test.mjs
      - name: Classify the complete change set
        id: scope
        run: node scripts/ci-product-scope.mjs

  validate:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/product-site-checks.yml

  deploy:
    # Only a positively classified brochure-only main push publishes automatically.
    # Mixed/shared/application changes keep the explicit manual publication path.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.WITSELF_PRODUCT_PUBLISH_ENABLED == 'true' &&
      needs.validate.result == 'success' &&
      ((github.event_name == 'push' && needs.changes.outputs.website_only == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [changes, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: product-site
      url: https://witself.com/
    steps:
      - name: Require the exact launch ref and hold value
        env:
          LAUNCH_ENABLED: ${{ vars.WITSELF_PRODUCT_PUBLISH_ENABLED }}
        # Actions string comparisons ignore case; the final check does not.
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$LAUNCH_ENABLED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the committed Wrangler dependency set
        run: npm ci --ignore-scripts --prefix infra/cloudflare/control-plane
      - name: Verify the shared Wrangler version
        run: |
          node --input-type=module <<'NODE'
          import { assertWranglerVersion } from './infra/cloudflare/wrangler-version.mjs';
          await assertWranglerVersion('control-plane');
          NODE
      - name: Build the approved production site
        run: node web/product/build.mjs --site-url https://witself.com/ --production
      - name: Require the current main commit before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current_main" = "$GITHUB_SHA"
      - name: Deploy static assets to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          infra/cloudflare/control-plane/node_modules/.bin/wrangler deploy \
            --config web/product/wrangler.toml \
            --env-file infra/cloudflare/wrangler-production-empty.env
