---
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: "/infra/pulumi"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - "/infra/cloudflare/agent-email"
      - "/infra/cloudflare/agent-email-send"
      - "/infra/cloudflare/control-plane"
      - "/infra/cloudflare/support-email-intake"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      wrangler:
        group-by: dependency-name
        patterns:
          - wrangler
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - wrangler
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
