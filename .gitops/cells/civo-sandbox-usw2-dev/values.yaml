cell:
  name: civo-sandbox-usw2-dev
  cloud: civo
  region: phx1
  # These checked-in names are documentation/defaults only. The supported
  # Civo Pulumi path replaces both values with the cluster's Civo-managed
  # DNS name before Argo CD applies this file. Do not deploy this values file
  # directly: externalDNS is intentionally disabled for Civo.
  domain: cells.witself.witwave.ai
  apiHost: api.civo-sandbox-usw2-dev.cells.witself.witwave.ai
gitops:
  repoURL: https://github.com/witwave-ai/witself
  targetRevision: main
  valuesPath: .gitops/cells/civo-sandbox-usw2-dev/values.yaml
apps:
  civoPostgres:
    enabled: true
    namespace: witself
    chartVersion: 18.8.0
    authSecretName: witself-postgresql-auth
    storage: 8Gi
  witselfServer:
    enabled: true
    namespace: witself
    # The apps chart emits worker.agentEmailRetention settings, which require
    # the v0.0.211+ server chart schema.
    chartVersion: 0.0.223
    imageTag: 0.0.223
    backendKind: managed
    # Temporary receive-only acceptance pilot for the isolated disposable
    # Personal account. The matching private key remains only in Cloudflare.
    agentEmail:
      receivePilot:
        enabled: true
        domain: agent-mail.witwave.ai
        audience: civo-sandbox-usw2-dev
        realmID: realm_p7o5lmjihbwh26zx
        agentIDs:
          - agent_niom6kesnqmdh4wy
          - agent_qxqb4u63bhcl6cv5
          - agent_g3nlqv2iy6bo4n4a
          - agent_rszuicjsewjdwmko
          - agent_pjezn7cg2upm3g45
        retryCanaryAgentID: agent_niom6kesnqmdh4wy
        relayPublicKeysJSON: '{"pilot_20260721_v1":"4YFALyKdS19xyYFyoJkP1kydVKw0xlmhf92Hog5b81s="}'
        relayReplayWindow: 5m
    backup:
      enabled: true
      validationEnabled: false
      targetName: witself-backup
    replicaCount: 1
    podDisruptionBudget:
      enabled: false
    topologySpreadConstraints: []
    worker:
      enabled: true
      replicaCount: 2
      podDisruptionBudget:
        enabled: false
      topologySpreadConstraints: []
    awsAlbIngress:
      enabled: false
    gcpIngress:
      enabled: false
    civoIngress:
      enabled: true
      className: traefik
      clusterIssuer: letsencrypt-prod
      tlsSecretName: witself-api-tls
      acme:
        email: ""
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretName: letsencrypt-prod-private-key
    secrets:
      bootstrap:
        enabled: true
        targetName: witself-bootstrap
        tokenKey: token
        ttlKey: ttl
      database:
        enabled: true
        targetName: witself-db
        urlKey: dsn
      provision:
        enabled: true
        targetName: witself-provision
        tokenKey: token
platform:
  awsAlbIngress:
    enabled: false
  certManager:
    enabled: true
    chartVersion: v1.20.3
    namespace: cert-manager
    serviceAccountAnnotations: {}
    podLabels: {}
  externalDNS:
    enabled: false
  externalSecrets:
    enabled: false
    serviceAccountAnnotations: {}
    azureVaultURL: ""
  keda:
    enabled: false
  # Civo's K3s profile supplies metrics-server.
  metricsServer:
    enabled: false
