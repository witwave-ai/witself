cell:
  name: civo-sandbox-use1-backup
  cloud: civo
  region: nyc1
  # These checked-in names are documentation/defaults only. The supported
  # Civo Pulumi path replaces both values with the cluster's Civo-managed
  # DNS name before Argo CD applies this file. Do not deploy this values file
  # directly: externalDNS is intentionally disabled for Civo.
  domain: cells.witself.witwave.ai
  apiHost: api.civo-sandbox-use1-backup.cells.witself.witwave.ai
gitops:
  repoURL: https://github.com/witwave-ai/witself
  targetRevision: main
  valuesPath: .gitops/cells/civo-sandbox-use1-backup/values.yaml
apps:
  civoPostgres:
    enabled: true
    namespace: witself
    chartVersion: 18.8.0
    authSecretName: witself-postgresql-auth
    storage: 8Gi
  witselfServer:
    enabled: true
    namespace: witself
    # The apps chart emits worker.agentEmailRetention settings, which require
    # the v0.0.211+ server chart schema.
    chartVersion: 0.0.243
    imageTag: 0.0.243
    backendKind: managed
    backup:
      enabled: true
      validationEnabled: true
      targetName: witself-backup
    replicaCount: 1
    podDisruptionBudget:
      enabled: false
    topologySpreadConstraints: []
    worker:
      enabled: true
      replicaCount: 2
      podDisruptionBudget:
        enabled: false
      topologySpreadConstraints: []
    awsAlbIngress:
      enabled: false
    gcpIngress:
      enabled: false
    civoIngress:
      enabled: true
      className: traefik
      clusterIssuer: letsencrypt-prod
      tlsSecretName: witself-api-tls
      acme:
        email: ""
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretName: letsencrypt-prod-private-key
    secrets:
      bootstrap:
        enabled: true
        targetName: witself-bootstrap
        tokenKey: token
        ttlKey: ttl
      database:
        enabled: true
        targetName: witself-db
        urlKey: dsn
      provision:
        enabled: true
        targetName: witself-provision
        tokenKey: token
platform:
  awsAlbIngress:
    enabled: false
  certManager:
    enabled: true
    chartVersion: v1.20.3
    namespace: cert-manager
    serviceAccountAnnotations: {}
    podLabels: {}
  externalDNS:
    enabled: false
  externalSecrets:
    enabled: false
    serviceAccountAnnotations: {}
    azureVaultURL: ""
  keda:
    enabled: false
  # This cell currently has no resource Metrics API. Replica counts remain
  # manual; install metrics-server only through a separately reviewed rollout.
  metricsServer:
    enabled: false
