rule_files:
  - ../files/postgresql.rules.yaml
evaluation_interval: 30s
tests:
  - name: connection buckets aggregate per exporter without dilution by another database server
    interval: 1m
    input_series:
      - series: pg_stat_activity_count{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",datname="witself",state="active",usename="witself",application_name="server",backend_type="client backend",wait_event_type="",wait_event=""}
        values: 40+0x15
      - series: pg_stat_activity_count{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",datname="postgres",state="idle",usename="postgres",application_name="worker",backend_type="client backend",wait_event_type="Client",wait_event="ClientRead"}
        values: 41+0x15
      - series: pg_settings_max_connections{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics"}
        values: 100+0x15
      - series: pg_stat_activity_count{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.2:9187",service="witself-postgresql-metrics",datname="other",state="idle"}
        values: 0+0x15
      - series: pg_settings_max_connections{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.2:9187",service="witself-postgresql-metrics"}
        values: 1000+0x15
    alert_rule_test:
      - eval_time: 9m
        alertname: WitselfPostgreSQLConnectionsHigh
        exp_alerts: []
      - eval_time: 10m
        alertname: WitselfPostgreSQLConnectionsHigh
        exp_alerts:
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.1:9187
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: PostgreSQL connections exceed 80 percent of max_connections.
              runbook: docs/observability-and-operations.md#postgresql-alerts
  - name: exact warning thresholds and healthy database do not fire
    interval: 1m
    input_series:
      - series: pg_stat_activity_count{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",datname="witself",state="active"}
        values: 80+0x15
      - series: pg_settings_max_connections{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics"}
        values: 100+0x15
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",datname="witself",state="idle in transaction"}
        values: 300+0x15
      - series: pg_up{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics"}
        values: 1+0x15
    alert_rule_test:
      - eval_time: 15m
        alertname: WitselfPostgreSQLConnectionsHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: WitselfPostgreSQLExporterUnavailable
        exp_alerts: []
      - eval_time: 15m
        alertname: WitselfPostgreSQLDown
        exp_alerts: []
  - name: oldest transaction persists across activity bucket changes
    interval: 1m
    input_series:
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",datname="witself",state="active",usename="witself",application_name="server"}
        values: 301+0x2 0+0x4
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",datname="postgres",state="idle in transaction",usename="postgres",application_name="worker"}
        values: 0+0x2 302+0x4
    alert_rule_test:
      - eval_time: 4m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts: []
      - eval_time: 5m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts:
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.1:9187
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: The oldest PostgreSQL transaction outside account exports exceeds five minutes.
              runbook: docs/observability-and-operations.md#postgresql-alerts
  - name: deadlock counter reset alone is quiet but a subsequent increment alerts immediately
    interval: 1m
    input_series:
      - series: pg_stat_database_deadlocks{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",datid="1",datname="witself"}
        values: 10 10 0 0 1 1
      - series: pg_stat_database_deadlocks{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",datid="2",datname="postgres"}
        values: 10+0x5
    alert_rule_test:
      - eval_time: 3m
        alertname: WitselfPostgreSQLDeadlocks
        exp_alerts: []
      - eval_time: 4m
        alertname: WitselfPostgreSQLDeadlocks
        exp_alerts:
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.1:9187
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: PostgreSQL detected a deadlock in the last ten minutes.
              runbook: docs/observability-and-operations.md#postgresql-alerts
  - name: unrelated exporter cannot hide absent serving database metrics
    interval: 1m
    input_series:
      - series: pg_up{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="unrelated-postgresql-metrics"}
        values: 1+0x15
    alert_rule_test:
      - eval_time: 9m
        alertname: WitselfPostgreSQLExporterUnavailable
        exp_alerts: []
      - eval_time: 10m
        alertname: WitselfPostgreSQLExporterUnavailable
        exp_alerts:
          - exp_labels:
              namespace: witself
              severity: critical
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations: &id001
              summary: PostgreSQL exporter metrics are absent or cannot connect to the database.
              runbook: docs/observability-and-operations.md#postgresql-alerts
      - eval_time: 10m
        alertname: WitselfPostgreSQLDown
        exp_alerts: []
  - name: database connection failure pages before exporter unavailable escalation
    interval: 1m
    input_series:
      - series: pg_up{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics"}
        values: 0+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: WitselfPostgreSQLDown
        exp_alerts: []
      - eval_time: 5m
        alertname: WitselfPostgreSQLDown
        exp_alerts:
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.1:9187
              severity: critical
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: PostgreSQL exporter cannot connect to the database.
              runbook: docs/observability-and-operations.md#postgresql-alerts
      - eval_time: 9m
        alertname: WitselfPostgreSQLExporterUnavailable
        exp_alerts: []
      - eval_time: 10m
        alertname: WitselfPostgreSQLExporterUnavailable
        exp_alerts:
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.1:9187
              severity: critical
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations: *id001
  - name: brief PostgreSQL restart clears pending availability alerts
    interval: 1m
    input_series:
      - series: pg_up{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics"}
        values: 0 0 1+0x13
    alert_rule_test:
      - eval_time: 5m
        alertname: WitselfPostgreSQLDown
        exp_alerts: []
      - eval_time: 10m
        alertname: WitselfPostgreSQLExporterUnavailable
        exp_alerts: []
  - name: account exports at thirteen minutes do not page the general rule
    interval: 1m
    input_series:
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",application_name="witself-export-account",usename="witself"}
        values: 0+60x20
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",application_name="witself-export-backup",usename="witself"}
        values: 0+60x20
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",application_name="witself-export-evacuation",usename="witself"}
        values: 0+60x20
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",application_name="witself-export-self",usename="witself"}
        values: 0+60x20
    alert_rule_test:
      - eval_time: 13m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: WitselfPostgreSQLExportTransactionAgeHigh
        exp_alerts: []
  - name: unlabeled application transaction still pages at eleven minutes
    interval: 1m
    input_series:
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",usename="witself"}
        values: 0+60x15
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",application_name="witself-export-backup",usename="witself"}
        values: 600+60x15
    alert_rule_test:
      - eval_time: 10m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts: []
      - eval_time: 11m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts:
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.1:9187
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: The oldest PostgreSQL transaction outside account exports exceeds five minutes.
              runbook: docs/observability-and-operations.md#postgresql-alerts
  - name: export pages after the long reader threshold persists
    interval: 1m
    input_series:
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",application_name="witself-export-backup",usename="witself"}
        values: 2400+60x15
    alert_rule_test:
      - eval_time: 10m
        alertname: WitselfPostgreSQLExportTransactionAgeHigh
        exp_alerts: []
      - eval_time: 11m
        alertname: WitselfPostgreSQLExportTransactionAgeHigh
        exp_alerts:
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.1:9187
              application_name: witself-export-backup
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: An account export transaction has been open for more than 45 minutes.
              runbook: docs/observability-and-operations.md#postgresql-alerts
      - eval_time: 11m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts: []
  - name: pg_dump stays in the general rule
    interval: 1m
    input_series:
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",application_name="pg_dump",usename="witself_backup_dump"}
        values: 0+60x15
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.2:9187",service="witself-postgresql-metrics",application_name="pg_dump",usename="witself_backup_dump"}
        values: 2400+60x15
    alert_rule_test:
      - eval_time: 10m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts:
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.2:9187
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: The oldest PostgreSQL transaction outside account exports exceeds five minutes.
              runbook: docs/observability-and-operations.md#postgresql-alerts
      - eval_time: 11m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts:
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.1:9187
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: The oldest PostgreSQL transaction outside account exports exceeds five minutes.
              runbook: docs/observability-and-operations.md#postgresql-alerts
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.2:9187
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: The oldest PostgreSQL transaction outside account exports exceeds five minutes.
              runbook: docs/observability-and-operations.md#postgresql-alerts
      - eval_time: 11m
        alertname: WitselfPostgreSQLExportTransactionAgeHigh
        exp_alerts: []
  - name: near miss application names stay in the general rule
    interval: 1m
    input_series:
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",application_name="witself-export-other"}
        values: 0+60x15
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.2:9187",service="witself-postgresql-metrics",application_name="witself-export-backup-old"}
        values: 0+60x15
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.3:9187",service="witself-postgresql-metrics",application_name="pg_dumpall"}
        values: 0+60x15
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.4:9187",service="witself-postgresql-metrics",application_name="witself-export-other"}
        values: 2400+60x15
    alert_rule_test:
      - eval_time: 11m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts:
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.1:9187
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: The oldest PostgreSQL transaction outside account exports exceeds five minutes.
              runbook: docs/observability-and-operations.md#postgresql-alerts
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.2:9187
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: The oldest PostgreSQL transaction outside account exports exceeds five minutes.
              runbook: docs/observability-and-operations.md#postgresql-alerts
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.3:9187
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: The oldest PostgreSQL transaction outside account exports exceeds five minutes.
              runbook: docs/observability-and-operations.md#postgresql-alerts
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.4:9187
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: The oldest PostgreSQL transaction outside account exports exceeds five minutes.
              runbook: docs/observability-and-operations.md#postgresql-alerts
      - eval_time: 11m
        alertname: WitselfPostgreSQLExportTransactionAgeHigh
        exp_alerts: []
  - name: exact export threshold does not fire
    interval: 1m
    input_series:
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",application_name="witself-export-backup",usename="witself"}
        values: 2700+0x15
    alert_rule_test:
      - eval_time: 15m
        alertname: WitselfPostgreSQLExportTransactionAgeHigh
        exp_alerts: []
  - name: export transaction persists across activity bucket changes
    interval: 1m
    input_series:
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",application_name="witself-export-backup",state="active",wait_event="ClientWrite"}
        values: 2700+60x3 0+0x12
      - series: pg_stat_activity_max_tx_duration{namespace="witself",job="witself-postgresql-metrics",instance="10.0.0.1:9187",service="witself-postgresql-metrics",application_name="witself-export-backup",state="idle in transaction",wait_event="ClientRead"}
        values: 0+0x3 2940+60x12
    alert_rule_test:
      - eval_time: 5m30s
        alertname: WitselfPostgreSQLExportTransactionAgeHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: WitselfPostgreSQLExportTransactionAgeHigh
        exp_alerts:
          - exp_labels:
              namespace: witself
              job: witself-postgresql-metrics
              instance: 10.0.0.1:9187
              application_name: witself-export-backup
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: An account export transaction has been open for more than 45 minutes.
              runbook: docs/observability-and-operations.md#postgresql-alerts
      - eval_time: 5m30s
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: WitselfPostgreSQLTransactionAgeHigh
        exp_alerts: []
  - name: A1 OOM fires per pod then resolves despite the historic reason
    interval: 1m
    input_series:
      - series: kube_pod_container_status_restarts_total{job="kube-state-metrics",namespace="witself",pod="witself-postgresql-0",container="postgresql",instance="10.0.0.10:8080",uid="postgresql-uid-0"}
        values: 0+0x10 1+0x119
      - series: kube_pod_container_status_last_terminated_reason{job="kube-state-metrics",namespace="witself",pod="witself-postgresql-0",container="postgresql",instance="10.0.0.10:8080",uid="postgresql-uid-0",reason="OOMKilled"}
        values: _x11 1+0x119
    alert_rule_test:
      - eval_time: 12m
        alertname: WitselfPostgreSQLOOMKilled
        exp_alerts:
          - exp_labels:
              namespace: witself
              pod: witself-postgresql-0
              severity: critical
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: The PostgreSQL container was OOM-killed and restarted within the last 30 minutes.
              description: kube-state-metrics reports OOMKilled as the PostgreSQL container's last termination reason and its restart count rose within 30 minutes. Both witself-server replicas lose the database while PostgreSQL restarts. Check WitselfPostgreSQLMemoryNearLimit and the cell's apps.civoPostgres.resourcesPreset.
              runbook: docs/observability-and-operations.md#postgresql-alerts
      - eval_time: 25m
        alertname: WitselfPostgreSQLOOMKilled
        exp_alerts:
          - exp_labels:
              namespace: witself
              pod: witself-postgresql-0
              severity: critical
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: The PostgreSQL container was OOM-killed and restarted within the last 30 minutes.
              description: kube-state-metrics reports OOMKilled as the PostgreSQL container's last termination reason and its restart count rose within 30 minutes. Both witself-server replicas lose the database while PostgreSQL restarts. Check WitselfPostgreSQLMemoryNearLimit and the cell's apps.civoPostgres.resourcesPreset.
              runbook: docs/observability-and-operations.md#postgresql-alerts
      - eval_time: 38m
        alertname: WitselfPostgreSQLOOMKilled
        exp_alerts:
          - exp_labels:
              namespace: witself
              pod: witself-postgresql-0
              severity: critical
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: The PostgreSQL container was OOM-killed and restarted within the last 30 minutes.
              description: kube-state-metrics reports OOMKilled as the PostgreSQL container's last termination reason and its restart count rose within 30 minutes. Both witself-server replicas lose the database while PostgreSQL restarts. Check WitselfPostgreSQLMemoryNearLimit and the cell's apps.civoPostgres.resourcesPreset.
              runbook: docs/observability-and-operations.md#postgresql-alerts
      - eval_time: 10m
        alertname: WitselfPostgreSQLOOMKilled
        exp_alerts: []
      - eval_time: 47m
        alertname: WitselfPostgreSQLOOMKilled
        exp_alerts: []
      - eval_time: 60m
        alertname: WitselfPostgreSQLOOMKilled
        exp_alerts: []
      - eval_time: 130m
        alertname: WitselfPostgreSQLOOMKilled
        exp_alerts: []
      - eval_time: 12m
        alertname: WitselfPostgreSQLRestarted
        exp_alerts: []
      - eval_time: 25m
        alertname: WitselfPostgreSQLRestarted
        exp_alerts: []
      - eval_time: 38m
        alertname: WitselfPostgreSQLRestarted
        exp_alerts: []
      - eval_time: 47m
        alertname: WitselfPostgreSQLRestarted
        exp_alerts: []
  - name: A2 non-OOM restarts remain partitioned per pod
    interval: 1m
    input_series:
      - series: kube_pod_container_status_restarts_total{job="kube-state-metrics",namespace="witself",pod="witself-postgresql-0",container="postgresql",instance="10.0.0.10:8080",uid="postgresql-uid-0"}
        values: 0+0x10 1+0x36
      - series: kube_pod_container_status_last_terminated_reason{job="kube-state-metrics",namespace="witself",pod="witself-postgresql-0",container="postgresql",instance="10.0.0.10:8080",uid="postgresql-uid-0",reason="Error"}
        values: _x11 1+0x36
      - series: kube_pod_container_status_restarts_total{job="kube-state-metrics",namespace="witself",pod="witself-postgresql-1",container="postgresql",instance="10.0.0.10:8080",uid="postgresql-uid-1"}
        values: 0+0x10 1+0x36
      - series: kube_pod_container_status_last_terminated_reason{job="kube-state-metrics",namespace="witself",pod="witself-postgresql-1",container="postgresql",instance="10.0.0.10:8080",uid="postgresql-uid-1",reason="Completed"}
        values: _x11 1+0x36
    alert_rule_test:
      - eval_time: 12m
        alertname: WitselfPostgreSQLRestarted
        exp_alerts:
          - exp_labels:
              namespace: witself
              pod: witself-postgresql-0
              severity: critical
              service: witself-postgresql
