rule_files:
  - ../files/founder-open-plane.rules.yaml
evaluation_interval: 1m
tests:
  - name: missing worker metrics alerts without identifying a pod
    interval: 1m
    input_series:
      - series: witself_up
        values: 1+0x10
    alert_rule_test:
      - eval_time: 4m
        alertname: WitselfWorkerMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: witself-worker
              witself_alert: "true"
            exp_annotations:
              summary: Witself worker metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: logical email storage threshold is aggregate and value free
    interval: 1m
    input_series:
      - series: witself_agent_email_cell_storage_retained_bytes
        values: 81+0x20
      - series: witself_agent_email_cell_storage_admission_bytes
        values: 100+0x20
      - series: witself_agent_email_cell_storage_hard_bytes
        values: 200+0x20
      - series: witself_agent_email_cell_storage_root_rows
        values: 1+0x20
      - series: witself_agent_email_cell_storage_admission_root_rows
        values: 100+0x20
      - series: witself_agent_email_cell_storage_counted_rows
        values: 1+0x20
      - series: witself_agent_email_cell_storage_hard_counted_rows
        values: 100+0x20
    alert_rule_test:
      - eval_time: 16m
        alertname: WitselfAgentEmailStorageApproachingAdmission
        exp_alerts:
          - exp_labels:
              severity: warning
              service: agent-email-storage
              witself_alert: "true"
            exp_annotations:
              summary: Agent-email logical storage is at or above 80 percent of a protective boundary.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: a missing logical storage gauge fails the ledger closed
    interval: 1m
    input_series:
      - series: witself_agent_email_cell_storage_metrics_up
        values: 1+0x10
      - series: witself_agent_email_cell_storage_retained_bytes
        values: 10+0x10
      - series: witself_agent_email_cell_storage_admission_bytes
        values: 100+0x10
      - series: witself_agent_email_cell_storage_root_rows
        values: 1+0x10
      - series: witself_agent_email_cell_storage_admission_root_rows
        values: 100+0x10
      - series: witself_agent_email_cell_storage_counted_rows
        values: 1+0x10
      - series: witself_agent_email_cell_storage_hard_counted_rows
        values: 100+0x10
    alert_rule_test:
      - eval_time: 4m
        alertname: WitselfAgentEmailStorageLedgerUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: agent-email-storage
              witself_alert: "true"
            exp_annotations:
              summary: The schema-91 agent-email storage ledger cannot be read.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: logical email storage alerts at the exact operating threshold
    interval: 1m
    input_series:
      - series: witself_agent_email_cell_storage_retained_bytes
        values: 80+0x20
      - series: witself_agent_email_cell_storage_admission_bytes
        values: 100+0x20
      - series: witself_agent_email_cell_storage_hard_bytes
        values: 200+0x20
      - series: witself_agent_email_cell_storage_root_rows
        values: 1+0x20
      - series: witself_agent_email_cell_storage_admission_root_rows
        values: 100+0x20
      - series: witself_agent_email_cell_storage_counted_rows
        values: 1+0x20
      - series: witself_agent_email_cell_storage_hard_counted_rows
        values: 100+0x20
    alert_rule_test:
      - eval_time: 16m
        alertname: WitselfAgentEmailStorageApproachingAdmission
        exp_alerts:
          - exp_labels:
              severity: warning
              service: agent-email-storage
              witself_alert: "true"
            exp_annotations:
              summary: Agent-email logical storage is at or above 80 percent of a protective boundary.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: postgres pvc metric absence alerts after the bounded delay
    interval: 1m
    alert_rule_test:
      - eval_time: 11m
        alertname: WitselfPostgresPVCMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: postgres-storage
              witself_alert: "true"
            exp_annotations:
              summary: PostgreSQL PVC capacity metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: one full postgres pvc cannot hide behind aggregate free space
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="witself",persistentvolumeclaim="data-postgresql-0"}'
        values: 100+0x20
      - series: 'kubelet_volume_stats_available_bytes{namespace="witself",persistentvolumeclaim="data-postgresql-0"}'
        values: 10+0x20
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="witself",persistentvolumeclaim="data-postgresql-1"}'
        values: 900+0x20
      - series: 'kubelet_volume_stats_available_bytes{namespace="witself",persistentvolumeclaim="data-postgresql-1"}'
        values: 900+0x20
    alert_rule_test:
      - eval_time: 16m
        alertname: WitselfPostgresPVCApproachingCapacity
        exp_alerts:
          - exp_labels:
              severity: critical
              service: postgres-storage
              witself_alert: "true"
            exp_annotations:
              summary: PostgreSQL PVC usage is at or above 80 percent.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: postgres pvc available-only metrics fail closed
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="witself",persistentvolumeclaim="data-postgresql-0"}'
        values: 10+0x20
    alert_rule_test:
      - eval_time: 11m
        alertname: WitselfPostgresPVCMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: postgres-storage
              witself_alert: "true"
            exp_annotations:
              summary: PostgreSQL PVC capacity metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: postgres pvc alerts at the exact operating threshold
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="witself",persistentvolumeclaim="data-postgresql-0"}'
        values: 100+0x20
      - series: 'kubelet_volume_stats_available_bytes{namespace="witself",persistentvolumeclaim="data-postgresql-0"}'
        values: 20+0x20
    alert_rule_test:
      - eval_time: 16m
        alertname: WitselfPostgresPVCApproachingCapacity
        exp_alerts:
          - exp_labels:
              severity: critical
              service: postgres-storage
              witself_alert: "true"
            exp_annotations:
              summary: PostgreSQL PVC usage is at or above 80 percent.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: postgres pvc capacity-only metrics fail closed
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="witself",persistentvolumeclaim="data-postgresql-0"}'
        values: 100+0x20
    alert_rule_test:
      - eval_time: 11m
        alertname: WitselfPostgresPVCMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: postgres-storage
              witself_alert: "true"
            exp_annotations:
              summary: PostgreSQL PVC capacity metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: watchdog heartbeat always fires and never reaches the incident route
    interval: 1m
    # Deliberately seeds only an unrelated, zero-valued series: the watchdog must
    # fire from vector(1) alone. A watchdog rewritten to depend on any Witself
    # metric would stop firing here instead of passing on a helpful seed.
    input_series:
      - series: witself_watchdog_unrelated_probe
        values: 0+0x10
    alert_rule_test:
      - eval_time: 5m
        alertname: WitselfWatchdog
        exp_alerts:
          - exp_labels:
              severity: none
              service: monitoring
              witself_watchdog: "true"
            exp_annotations:
              summary: Witself alerting pipeline heartbeat.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: support first-response breach fires only past the day boundary
    interval: 1m
    input_series:
      - series: witself_support_oldest_unanswered_seconds
        values: 86300+60x39
    alert_rule_test:
      - eval_time: 5m
        alertname: WitselfSupportFirstResponseBreach
        exp_alerts: []
      - eval_time: 20m
        alertname: WitselfSupportFirstResponseBreach
        exp_alerts:
          - exp_labels:
              severity: critical
              service: witself-server
              witself_alert: "true"
            exp_annotations:
              summary: A support ticket has waited over 24h for its first response — the published promise is one business day.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: transcript entries batch rejection ratio fires above the threshold
    interval: 1m
    input_series:
      - series: 'witself_http_requests_total{method="POST",route="/v1/transcripts/{transcript}/entries:batch",status_class="2xx",result="success"}'
        values: 0+18x30
      - series: 'witself_http_requests_total{method="POST",route="/v1/transcripts/{transcript}/entries:batch",status_class="4xx",result="error"}'
        values: 0+1x30
      - series: 'witself_http_requests_total{method="POST",route="/v1/transcripts/{transcript}/entries:batch",status_class="5xx",result="error"}'
        values: 0+1x30
    alert_rule_test:
      - eval_time: 16m
        alertname: WitselfTranscriptEntriesBatchRejectionRatioHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              service: witself-server
              witself_alert: "true"
            exp_annotations:
              summary: Transcript entries:batch responses exceed the bounded rejection ratio.
              description: More than 5 percent of transcript batch appends have returned 4xx or 5xx for 10 minutes while traffic exceeds 0.01 requests per second; inspect client payload compatibility and server errors.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: transcript entries batch rejection ratio stays quiet below the threshold
    interval: 1m
    input_series:
      - series: 'witself_http_requests_total{method="POST",route="/v1/transcripts/{transcript}/entries:batch",status_class="2xx",result="success"}'
        values: 0+98x30
      - series: 'witself_http_requests_total{method="POST",route="/v1/transcripts/{transcript}/entries:batch",status_class="4xx",result="error"}'
        values: 0+1x30
      - series: 'witself_http_requests_total{method="POST",route="/v1/transcripts/{transcript}/entries:batch",status_class="5xx",result="error"}'
        values: 0+1x30
    alert_rule_test:
      - eval_time: 20m
        alertname: WitselfTranscriptEntriesBatchRejectionRatioHigh
        exp_alerts: []
  - name: transcript retention backlog pressure fires after repeated capped scans
    interval: 1m
    input_series:
      - series: 'witself_worker_retention_items_total{mode="enforce",kind="scan_capped_batches"}'
        values: 0+0x4 1+0x4 2+0x4 3+0x4 4+0x4 5+0x4 6+0x4 7+0x4 8+0x4 9+0x4 10+0x10
    alert_rule_test:
      - eval_time: 45m
        alertname: WitselfTranscriptRetentionBacklogPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              service: transcript-retention
              witself_alert: "true"
            exp_annotations:
              summary: Transcript retention has sustained backlog-pressure signals.
              description: At least three enforce batches hit the bounded scan cap in 30 minutes for 15 minutes; repeated scan saturation is the available server-side proxy for backlog growth, so inspect holds and worker throughput.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: transcript retention backlog pressure stays quiet below three capped scans
    interval: 1m
    input_series:
      - series: 'witself_worker_retention_items_total{mode="enforce",kind="scan_capped_batches"}'
        values: 0+0x14 1+0x14 2+0x30
    alert_rule_test:
      - eval_time: 45m
        alertname: WitselfTranscriptRetentionBacklogPressure
        exp_alerts: []
  - name: message retention backlog pressure fires after repeated capped scans
    interval: 1m
    input_series:
      - series: 'witself_worker_message_retention_items_total{mode="enforce",kind="scan_capped_batches"}'
        values: 0+0x4 1+0x4 2+0x4 3+0x4 4+0x4 5+0x4 6+0x4 7+0x4 8+0x4 9+0x4 10+0x10
    alert_rule_test:
      - eval_time: 45m
        alertname: WitselfMessageRetentionBacklogPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              service: message-retention
              witself_alert: "true"
            exp_annotations:
              summary: Message retention has sustained backlog-pressure signals.
              description: At least three enforce batches hit the bounded scan cap in 30 minutes for 15 minutes; repeated scan saturation is the available server-side proxy for backlog growth, so inspect held threads and worker throughput.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: message retention backlog pressure stays quiet below three capped scans
    interval: 1m
    input_series:
      - series: 'witself_worker_message_retention_items_total{mode="enforce",kind="scan_capped_batches"}'
        values: 0+0x14 1+0x14 2+0x30
    alert_rule_test:
      - eval_time: 45m
        alertname: WitselfMessageRetentionBacklogPressure
        exp_alerts: []
  - name: fact delete failure ratio fires above the threshold
    interval: 1m
    input_series:
      - series: 'witself_http_requests_total{method="DELETE",route="/v1/facts",status_class="2xx",result="success"}'
        values: 0+9x30
      - series: 'witself_http_requests_total{method="DELETE",route="/v1/facts/{fact}",status_class="5xx",result="error"}'
        values: 0+3x30
    alert_rule_test:
      - eval_time: 16m
        alertname: WitselfFactDeleteFailureRatioHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              service: witself-server
              witself_alert: "true"
            exp_annotations:
              summary: Fact delete requests exceed the bounded server-failure ratio.
              description: More than 5 percent of fact deletion previews or applies have returned 5xx for 5 minutes; inspect the fact store, audit writes, and deletion transaction failures.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: fact delete failure ratio stays quiet below the threshold
    interval: 1m
    input_series:
      - series: 'witself_http_requests_total{method="DELETE",route="/v1/facts",status_class="2xx",result="success"}'
        values: 0+99x30
      - series: 'witself_http_requests_total{method="DELETE",route="/v1/facts/{fact}",status_class="5xx",result="error"}'
        values: 0+1x30
    alert_rule_test:
      - eval_time: 20m
        alertname: WitselfFactDeleteFailureRatioHigh
        exp_alerts: []
  - name: avatar generation failure rate fires above the threshold
    interval: 1m
    input_series:
      - series: 'witself_http_requests_total{method="POST",route="/v1/self/avatar:generation-failed",status_class="2xx",result="success"}'
        values: 0+1x30
    alert_rule_test:
      - eval_time: 16m
        alertname: WitselfAvatarGenerationFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              service: witself-server
              witself_alert: "true"
            exp_annotations:
              summary: Clients are reporting a sustained avatar generation-failure rate.
              description: Successful avatar generation-failure reports have exceeded 0.003 per second for 10 minutes; inspect renderer compatibility, proposal validation, and client failure reason classes.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: avatar generation failure rate stays quiet below the threshold
    interval: 1m
    input_series:
      - series: 'witself_http_requests_total{method="POST",route="/v1/self/avatar:generation-failed",status_class="2xx",result="success"}'
        values: 0+0x9 1+0x20
    alert_rule_test:
      - eval_time: 20m
        alertname: WitselfAvatarGenerationFailureRateHigh
        exp_alerts: []
  - name: identity_capacity collector absence alerts after three minutes
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: WitselfIdentityCapacityMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: identity
              witself_alert: "true"
            exp_annotations:
              summary: Identity-capacity metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: identity_capacity collector failure alerts after three minutes
    interval: 1m
    input_series:
      - series: witself_identity_capacity_metrics_up
        values: 0+0x5
    alert_rule_test:
      - eval_time: 3m
        alertname: WitselfIdentityCapacityMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: identity
              witself_alert: "true"
            exp_annotations:
              summary: Identity-capacity metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: identity_capacity healthy collector does not alert
    interval: 1m
    input_series:
      - series: witself_identity_capacity_metrics_up
        values: 1+0x5
    alert_rule_test:
      - eval_time: 4m
        alertname: WitselfIdentityCapacityMetricsUnavailable
        exp_alerts: []
  - name: audit_append collector absence alerts for both expected processes after three minutes
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: WitselfAuditAppendMetricsUnavailable
        exp_alerts:
          - exp_labels:
              container: witself-server
              severity: critical
              service: audit
              witself_alert: "true"
            exp_annotations:
              summary: Audit-append metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
          - exp_labels:
              container: witself-worker
              severity: critical
              service: audit
              witself_alert: "true"
            exp_annotations:
              summary: Audit-append metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: audit_append missing worker alerts despite healthy server after three minutes
    interval: 1m
    input_series:
      - series: 'witself_audit_append_metrics_up{container="witself-server"}'
        values: 1+0x5
    alert_rule_test:
      - eval_time: 2m
        alertname: WitselfAuditAppendMetricsUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: WitselfAuditAppendMetricsUnavailable
        exp_alerts:
          - exp_labels:
              container: witself-worker
              severity: critical
              service: audit
              witself_alert: "true"
            exp_annotations:
              summary: Audit-append metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: audit_append missing server alerts despite healthy worker after three minutes
    interval: 1m
    input_series:
      - series: 'witself_audit_append_metrics_up{container="witself-worker"}'
        values: 1+0x5
    alert_rule_test:
      - eval_time: 3m
        alertname: WitselfAuditAppendMetricsUnavailable
        exp_alerts:
          - exp_labels:
              container: witself-server
              severity: critical
              service: audit
              witself_alert: "true"
            exp_annotations:
              summary: Audit-append metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: audit_append worker collector failure alerts despite healthy server after three minutes
    interval: 1m
    input_series:
      - series: 'witself_audit_append_metrics_up{container="witself-server"}'
        values: 1+0x5
      - series: 'witself_audit_append_metrics_up{container="witself-worker"}'
        values: 0+0x5
    alert_rule_test:
      - eval_time: 3m
        alertname: WitselfAuditAppendMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: audit
              witself_alert: "true"
            exp_annotations:
              summary: Audit-append metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: audit_append both healthy collectors do not alert
    interval: 1m
    input_series:
      - series: 'witself_audit_append_metrics_up{container="witself-server"}'
        values: 1+0x5
      - series: 'witself_audit_append_metrics_up{container="witself-worker"}'
        values: 1+0x5
    alert_rule_test:
      - eval_time: 4m
        alertname: WitselfAuditAppendMetricsUnavailable
        exp_alerts: []
  - name: audit_append missing second worker alerts despite healthy first worker and server
    interval: 1m
    input_series:
      - series: 'witself_up{namespace="witself",pod="s1",container="witself-server"}'
        values: 1+0x10
      - series: 'witself_worker_up{namespace="witself",pod="w1",container="witself-worker"}'
        values: 1+0x10
      - series: 'witself_worker_up{namespace="witself",pod="w2",container="witself-worker"}'
        values: 1+0x10
      - series: 'witself_audit_append_metrics_up{namespace="witself",pod="s1",container="witself-server"}'
        values: 1+0x10
      - series: 'witself_audit_append_metrics_up{namespace="witself",pod="w1",container="witself-worker"}'
        values: 1+0x10
    alert_rule_test:
      - eval_time: 2m
        alertname: WitselfAuditAppendMetricsUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: WitselfAuditAppendMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: audit
              witself_alert: "true"
            exp_annotations:
              summary: Audit-append metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
      - eval_time: 10m
        alertname: WitselfAuditAppendMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: audit
              witself_alert: "true"
            exp_annotations:
              summary: Audit-append metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: audit_append missing second server alerts despite healthy first server and worker
    interval: 1m
    input_series:
      - series: 'witself_up{namespace="witself",pod="s1",container="witself-server"}'
        values: 1+0x5
      - series: 'witself_up{namespace="witself",pod="s2",container="witself-server"}'
        values: 1+0x5
      - series: 'witself_worker_up{namespace="witself",pod="w1",container="witself-worker"}'
        values: 1+0x5
      - series: 'witself_audit_append_metrics_up{namespace="witself",pod="s1",container="witself-server"}'
        values: 1+0x5
      - series: 'witself_audit_append_metrics_up{namespace="witself",pod="w1",container="witself-worker"}'
        values: 1+0x5
    alert_rule_test:
      - eval_time: 3m
        alertname: WitselfAuditAppendMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: audit
              witself_alert: "true"
            exp_annotations:
              summary: Audit-append metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: audit_append collector in another namespace cannot cover a worker replica
    interval: 1m
    input_series:
      - series: 'witself_up{namespace="witself",pod="s1",container="witself-server"}'
        values: 1+0x5
      - series: 'witself_worker_up{namespace="witself",pod="w1",container="witself-worker"}'
        values: 1+0x5
      - series: 'witself_worker_up{namespace="witself",pod="w2",container="witself-worker"}'
        values: 1+0x5
      - series: 'witself_audit_append_metrics_up{namespace="witself",pod="s1",container="witself-server"}'
        values: 1+0x5
      - series: 'witself_audit_append_metrics_up{namespace="witself",pod="w1",container="witself-worker"}'
        values: 1+0x5
      - series: 'witself_audit_append_metrics_up{namespace="another-cell",pod="w2",container="witself-worker"}'
        values: 1+0x5
    alert_rule_test:
      - eval_time: 3m
        alertname: WitselfAuditAppendMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: audit
              witself_alert: "true"
            exp_annotations:
              summary: Audit-append metrics are unavailable.
              runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: audit_append collector in another container cannot cover a worker replica
    interval: 1m
    input_series:
      - series: 'witself_up{namespace="witself",pod="s1",container="witself-server"}'
        values: 1+0x5
      - series: 'witself_worker_up{namespace="witself",pod="w1",container="witself-worker"}'
