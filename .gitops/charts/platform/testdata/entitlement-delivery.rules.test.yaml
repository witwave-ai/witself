              "exp_annotations": {
                "summary": "Entitlement delivery observations are unavailable for a control-plane scrape target.",
                "runbook": "docs/billing-and-limits.md#entitlement-delivery-monitoring"
              }
            }
          ]
        }
      ]
    },
    {
      "name": "explicit disabled suppresses unknown stale and retained gap",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"witself-probes\",instance=\"cp:443\"}",
          "values": "1+0x500"
        },
        {
          "series": "witself_entitlement_delivery_enabled{job=\"witself-probes\",instance=\"cp:443\"}",
          "values": "0+0x500"
        },
        {
          "series": "witself_entitlement_delivery_metrics_up{job=\"witself-probes\",instance=\"cp:443\"}",
          "values": "0+0x500"
        },
        {
          "series": "witself_entitlement_delivery_last_ack_timestamp_seconds{job=\"witself-probes\",instance=\"cp:443\"}",
          "values": "0+0x500"
        },
        {
          "series": "witself_entitlement_delivery_last_cycle_completed_timestamp_seconds{job=\"witself-probes\",instance=\"cp:443\"}",
          "values": "60+0x500"
        },
        {
          "series": "witself_entitlement_delivery_cycle_started_timestamp_seconds{job=\"witself-probes\",instance=\"cp:443\"}",
          "values": "0+0x500"
        },
        {
          "series": "witself_entitlement_delivery_last_cycle_accounts{job=\"witself-probes\",instance=\"cp:443\",outcome=\"apply_pending\"}",
          "values": "1+0x500"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "7h",
          "alertname": "WitselfEntitlementDeliveryMetricsUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "7h",
          "alertname": "WitselfEntitlementDeliverySchedulerStale",
          "exp_alerts": []
        },
        {
          "eval_time": "7h",
          "alertname": "WitselfEntitlementDeliveryCycleIncomplete",
          "exp_alerts": []
        },
        {
          "eval_time": "7h",
          "alertname": "WitselfEntitlementDeliveryGap",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "pending gap persists then a fully measured zero clears it",
      "interval": "1m",
      "input_series": [
        {
          "series": "witself_entitlement_delivery_enabled{job=\"witself-probes\",instance=\"cp:443\"}",
          "values": "1+0x500"
        },
        {
          "series": "witself_entitlement_delivery_last_cycle_accounts{job=\"witself-probes\",instance=\"cp:443\",outcome=\"apply_pending\"}",
          "values": "1+0x39 0+0x20"
        },
        {
          "series": "witself_entitlement_delivery_last_cycle_accounts{job=\"witself-probes\",instance=\"cp:443\",outcome=\"failed\"}",
          "values": "0+0x60"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "29m",
          "alertname": "WitselfEntitlementDeliveryGap",
          "exp_alerts": []
        },
        {
          "eval_time": "31m",
          "alertname": "WitselfEntitlementDeliveryGap",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "witself-probes",
                "instance": "cp:443",
                "severity": "warning",
                "service": "entitlement-delivery",
                "witself_alert": "true"
              },
              "exp_annotations": {
                "summary": "A completed control-plane traversal retains pending or unverified entitlement deliveries.",
                "runbook": "docs/billing-and-limits.md#entitlement-delivery-monitoring"
              }
            }
          ]
        },
        {
          "eval_time": "40m",
          "alertname": "WitselfEntitlementDeliveryGap",
          "exp_alerts": []
        }
      ]
    },
