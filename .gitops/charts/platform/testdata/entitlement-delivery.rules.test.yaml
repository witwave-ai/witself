        {
          "series": "witself_entitlement_delivery_enabled{job=\"witself-probes\",instance=\"cp:443\"}",
          "values": "1+0x500"
        },
        {
          "series": "witself_entitlement_delivery_metrics_up{job=\"witself-probes\",instance=\"cp:443\"}",
          "values": "0+0x40"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "14m",
          "alertname": "WitselfEntitlementDeliveryMetricsUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
          "alertname": "WitselfEntitlementDeliveryMetricsUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "witself-probes",
