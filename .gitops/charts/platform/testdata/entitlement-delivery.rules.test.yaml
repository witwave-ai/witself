      "name": "missing second target is visible beside healthy first target",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"witself-probes\",instance=\"cp:443\"}",
          "values": "1+0x40"
        },
        {
          "series": "witself_entitlement_delivery_enabled{job=\"witself-probes\",instance=\"cp:443\"}",
          "values": "1+0x500"
        },
        {
          "series": "witself_entitlement_delivery_metrics_up{job=\"witself-probes\",instance=\"cp:443\"}",
          "values": "1+0x500"
        },
        {
          "series": "up{job=\"witself-probes\",instance=\"missing:443\"}",
          "values": "1+0x40"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "14m",
          "alertname": "WitselfEntitlementDeliveryMetricsUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
          "alertname": "WitselfEntitlementDeliveryMetricsUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "witself-probes",
                "instance": "missing:443",
                "severity": "warning",
                "service": "entitlement-delivery",
                "witself_alert": "true"
              },
              "exp_annotations": {
                "summary": "Entitlement delivery observations are unavailable for a control-plane scrape target.",
                "runbook": "docs/billing-and-limits.md#entitlement-delivery-monitoring"
              }
            }
          ]
        }
      ]
    },
