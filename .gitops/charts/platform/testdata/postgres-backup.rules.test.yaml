rule_files:
  - ../files/postgres-backup.rules.yaml
evaluation_interval: 30s
tests:
  - name: exact 8 hour threshold stays quiet and older backup pages after the hold
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_success_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics",instance="postgres-a:9187"}
        values: 60+0x540
    alert_rule_test:
      - eval_time: 8h1m
        alertname: WitselfPostgresBackupStale
        exp_alerts: []
      - eval_time: 8h6m
        alertname: WitselfPostgresBackupStale
        exp_alerts: []
      - eval_time: 8h7m
        alertname: WitselfPostgresBackupStale
        exp_alerts: &stale_alerts
          - exp_labels:
              namespace: witself
              severity: critical
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: PostgreSQL has no successful encrypted backup within 8 hours or its backup metric is absent.
              runbook: docs/backup-and-recovery.md#scheduled-postgresql-backups
  - name: successful dump every six hours keeps the stale page quiet
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_success_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics"}
        values: 60+0x359 21600+0x180
    alert_rule_test:
      - eval_time: 8h6m
        alertname: WitselfPostgresBackupStale
        exp_alerts: []
      - eval_time: 9h
        alertname: WitselfPostgresBackupStale
        exp_alerts: []
  - name: no first result or missing backup metric pages even with unrelated healthy exporter
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_success_timestamp_seconds{namespace="witself",service="unrelated-postgresql-metrics"}
        values: 0+60x10
    alert_rule_test:
      - eval_time: 4m
        alertname: WitselfPostgresBackupStale
        exp_alerts: []
      - eval_time: 5m
        alertname: WitselfPostgresBackupStale
        exp_alerts: *stale_alerts
  - name: initialized empty backup table pages before any successful run
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_success_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics"}
        values: 0+0x10
    alert_rule_test:
      - eval_time: 4m
        alertname: WitselfPostgresBackupStale
        exp_alerts: []
      - eval_time: 5m
        alertname: WitselfPostgresBackupStale
        exp_alerts: *stale_alerts
  - name: upload success clears an existing stale page
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_success_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics"}
        values: -28801+0x5 360+0x5
    alert_rule_test:
      - eval_time: 5m
        alertname: WitselfPostgresBackupStale
        exp_alerts: *stale_alerts
      - eval_time: 6m
        alertname: WitselfPostgresBackupStale
        exp_alerts: []
  - name: latest completed failure warns on first observation and remains after one hour
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_attempt_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics",instance="postgres-a:9187"}
        values: 1+0x70
      - series: witself_postgres_backup_last_attempt_succeeded{namespace="witself",service="witself-postgresql-metrics",instance="postgres-a:9187"}
        values: 0+0x70
    alert_rule_test:
      - eval_time: 0m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: &failed_alerts
          - exp_labels:
              namespace: witself
              severity: warning
              service: witself-postgresql
              witself_alert: 'true'
            exp_annotations:
              summary: PostgreSQL encrypted backup's latest attempt failed or exceeded its maximum runtime.
              runbook: docs/backup-and-recovery.md#scheduled-postgresql-backups
      - eval_time: 70m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: *failed_alerts
  - name: successful retry clears failure without resetting historical failure count
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_attempt_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics"}
        values: 1+0x5 360+0x5
      - series: witself_postgres_backup_last_attempt_succeeded{namespace="witself",service="witself-postgresql-metrics"}
        values: 0+0x5 1+0x5
      - series: witself_postgres_backup_failures_total{namespace="witself",service="witself-postgresql-metrics"}
        values: 3+0x11
    alert_rule_test:
      - eval_time: 5m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: *failed_alerts
      - eval_time: 6m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: *failed_alerts
      - eval_time: 17m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: []
  - name: running attempt stays quiet and warns only when it records failure
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_attempt_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics"}
        values: 1+0x10
      - series: witself_postgres_backup_last_attempt_succeeded{namespace="witself",service="witself-postgresql-metrics"}
        values: -1+0x5 0+0x5
    alert_rule_test:
      - eval_time: 5m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: []
      - eval_time: 6m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: *failed_alerts
  - name: unfinished attempt warns only after maximum job runtime and retry clears it
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_attempt_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics"}
        values: 1+0x122 7380+0x3
      - series: witself_postgres_backup_last_attempt_succeeded{namespace="witself",service="witself-postgresql-metrics"}
        values: -1+0x122 1+0x3
    alert_rule_test:
      - eval_time: 2h
        alertname: WitselfPostgresBackupFailed
        exp_alerts: []
      - eval_time: 2h1m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: *failed_alerts
      - eval_time: 2h3m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: *failed_alerts
      - eval_time: 2h14m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: []
  - name: initialized empty table is not a completed failed attempt
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_attempt_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics"}
        values: 0+0x180
      - series: witself_postgres_backup_last_attempt_succeeded{namespace="witself",service="witself-postgresql-metrics"}
        values: -1+0x180
      - series: witself_postgres_backup_failures_total{namespace="witself",service="witself-postgresql-metrics"}
        values: 0+0x180
    alert_rule_test:
      - eval_time: 5m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: []
      - eval_time: 3h
        alertname: WitselfPostgresBackupFailed
        exp_alerts: []
  - name: historical failures at exporter startup and unrelated failed exporter stay quiet
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_attempt_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics"}
        values: 1+0x10
      - series: witself_postgres_backup_last_attempt_succeeded{namespace="witself",service="witself-postgresql-metrics"}
        values: 1+0x10
      - series: witself_postgres_backup_failures_total{namespace="witself",service="witself-postgresql-metrics"}
        values: 3+0x10
      - series: witself_postgres_backup_last_attempt_timestamp_seconds{namespace="witself",service="unrelated-postgresql-metrics"}
        values: 1+0x10
      - series: witself_postgres_backup_last_attempt_succeeded{namespace="witself",service="unrelated-postgresql-metrics"}
        values: 0+0x10
    alert_rule_test:
      - eval_time: 0m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: []
      - eval_time: 5m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: []
  - name: a single failed dump fires the warning and nothing critical
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_success_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics"}
        values: 60+0x480
      - series: witself_postgres_backup_last_attempt_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics"}
        values: 60+0x59 3600+0x421
      - series: witself_postgres_backup_last_attempt_succeeded{namespace="witself",service="witself-postgresql-metrics"}
        values: 1+0x59 -1+0x1 0+0x419
    alert_rule_test:
      - eval_time: 1h2m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: *failed_alerts
      - eval_time: 1h2m
        alertname: WitselfPostgresBackupStale
        exp_alerts: []
      - eval_time: 7h59m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: *failed_alerts
      - eval_time: 7h59m
        alertname: WitselfPostgresBackupStale
        exp_alerts: []
  # The 2026-11-21 outage on that day's UTC clock and the six-hourly schedule:
  # the 03:00 dump succeeds at 03:03, outside network is lost 07:12-18:12, the
  # 09:00 and 15:00 attempts fail after two minutes, and the 21:00 attempt
  # succeeds at 21:03. The exporter keeps reading the table throughout.
  - name: failed dumps through an outage page once as stale and the next scheduled dump clears both
    interval: 1m
    input_series:
      - series: witself_postgres_backup_last_success_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics"}
        values: 1+0x182 10980+0x1079 75780+0x30
      - series: witself_postgres_backup_last_attempt_timestamp_seconds{namespace="witself",service="witself-postgresql-metrics"}
        values: 1+0x179 10800+0x359 32400+0x359 54000+0x359 75600+0x33
      - series: witself_postgres_backup_last_attempt_succeeded{namespace="witself",service="witself-postgresql-metrics"}
        values: 1+0x179 -1+0x2 1+0x356 -1+0x1 0+0x357 -1+0x1 0+0x357 -1+0x2 1+0x30
    alert_rule_test:
      - eval_time: 8h59m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: []
      - eval_time: 9h3m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: *failed_alerts
      - eval_time: 9h3m
        alertname: WitselfPostgresBackupStale
        exp_alerts: []
      - eval_time: 11h8m
        alertname: WitselfPostgresBackupStale
        exp_alerts: []
      - eval_time: 11h9m
        alertname: WitselfPostgresBackupStale
        exp_alerts: *stale_alerts
      # The 15:00 attempt replaces the failed row while it runs; the warning
      # is held across it.
      - eval_time: 15h1m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: *failed_alerts
      - eval_time: 18h30m
        alertname: WitselfPostgresBackupStale
        exp_alerts: *stale_alerts
      - eval_time: 18h30m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: *failed_alerts
      - eval_time: 21h1m
        alertname: WitselfPostgresBackupStale
        exp_alerts: *stale_alerts
      - eval_time: 21h4m
        alertname: WitselfPostgresBackupStale
        exp_alerts: []
      - eval_time: 21h4m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: *failed_alerts
      - eval_time: 21h15m
        alertname: WitselfPostgresBackupFailed
        exp_alerts: []
