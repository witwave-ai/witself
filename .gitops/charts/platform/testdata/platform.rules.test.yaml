    values: 2147483648+0x40
  - series: container_memory_working_set_bytes{job="kubelet",metrics_path="/metrics/cadvisor",namespace="witself",pod="witself-postgresql-0",container="metrics",id="/kubepods/postgresql/metrics",image="postgres-exporter:latest",instance="n1:10250",node="n1"}
