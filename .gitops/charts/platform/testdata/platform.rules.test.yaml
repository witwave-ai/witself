  input_series:
  # Initial working set: 1700 - 50 - 150 - (750 - 200) - 120 = 830.
  # At 20m Cached falls to 650: working set becomes 930; the hold ends at 35m.
  # The retired Inactive_file numerator reports 1300 even before the transition.
  # Dropping the Shmem correction reports only 630 then 730 and misses the alert.
