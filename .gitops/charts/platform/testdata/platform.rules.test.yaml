    alertname: WitselfPostgreSQLMemoryNearLimit
    exp_alerts: []
  - eval_time: 120m
    alertname: WitselfPostgreSQLMemoryNearLimit
    exp_alerts: []
- name: B3 PostgreSQL non-file memory at exactly eighty percent stays silent
