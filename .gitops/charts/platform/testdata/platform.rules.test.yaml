    values: 2147483648+0x40
  promql_expr_test:
  - expr: count(ALERTS{alertname="WitselfPostgreSQLMemoryNearLimit",alertstate="firing"})
    eval_time: 9m
    exp_samples: []
  - expr: count(ALERTS{alertname="WitselfPostgreSQLMemoryNearLimit",alertstate="firing"})
    eval_time: 11m
    exp_samples:
    - labels: "{}"
      value: 1
  - expr: count(ALERTS{alertname="WitselfPostgreSQLMemoryNearLimit",alertstate="firing"})
    eval_time: 30m
    exp_samples:
    - labels: "{}"
      value: 1
  alert_rule_test:
  - eval_time: 9m
    alertname: WitselfPostgreSQLMemoryNearLimit
    exp_alerts: []
  - eval_time: 11m
    alertname: WitselfPostgreSQLMemoryNearLimit
    exp_alerts:
    - exp_labels:
        namespace: witself
        pod: witself-postgresql-0
        container: postgresql
        severity: warning
        service: witself-postgresql
        witself_alert: 'true'
      exp_annotations:
        summary: The PostgreSQL container working set is above 90 percent of its memory
          limit.
        runbook: docs/observability-and-operations.md#postgresql-alerts
  - eval_time: 30m
