# Metric contracts audited against postgres_exporter v0.20.1, the version
# declared by Bitnami PostgreSQL 18.8.0. The chart's exporter image uses :latest;
# verify its resolved build version and these series during rollout.
# https://github.com/prometheus-community/postgres_exporter/blob/v0.20.1/collector/pg_stat_activity.go#L37-L57
# https://github.com/prometheus-community/postgres_exporter/blob/v0.20.1/collector/pg_setting.go#L90-L118
# https://github.com/prometheus-community/postgres_exporter/blob/v0.20.1/collector/pg_stat_database.go#L172-L181
# https://github.com/prometheus-community/postgres_exporter/blob/v0.20.1/exporter/postgres_exporter.go#L474-L479
groups:
  - name: witself-postgresql
    interval: 30s
    rules:
      # Aggregate every database/state/user/application/wait bucket per exporter
      # before dividing; the settings gauge has none of those activity labels.
      - alert: WitselfPostgreSQLConnectionsHigh
        expr: sum by (namespace, job, instance) (pg_stat_activity_count{namespace="witself",service="witself-postgresql-metrics"}) / max by (namespace, job, instance) (pg_settings_max_connections{namespace="witself",service="witself-postgresql-metrics"}) > 0.8
        for: 10m
        labels:
          severity: warning
          service: witself-postgresql
          witself_alert: "true"
        annotations:
          summary: PostgreSQL connections exceed 80 percent of max_connections.
          runbook: docs/observability-and-operations.md#postgresql-alerts
      - alert: WitselfPostgreSQLTransactionAgeHigh
        expr: max by (namespace, job, instance) (pg_stat_activity_max_tx_duration{namespace="witself",service="witself-postgresql-metrics",application_name!~"witself-export-(account|backup|evacuation|self)"}) > 300
        for: 5m
        labels:
          severity: warning
          service: witself-postgresql
          witself_alert: "true"
        annotations:
          summary: The oldest PostgreSQL transaction outside account exports exceeds five minutes.
          runbook: docs/observability-and-operations.md#postgresql-alerts
      - alert: WitselfPostgreSQLExportTransactionAgeHigh
        expr: max by (namespace, job, instance, application_name) (pg_stat_activity_max_tx_duration{namespace="witself",service="witself-postgresql-metrics",application_name=~"witself-export-(account|backup|evacuation|self)"}) > 2700
        for: 5m
        labels:
          severity: warning
          service: witself-postgresql
          witself_alert: "true"
        annotations:
          summary: An account export transaction has been open for more than 45 minutes.
          runbook: docs/observability-and-operations.md#postgresql-alerts
      - alert: WitselfPostgreSQLDeadlocks
        expr: sum by (namespace, job, instance) (increase(pg_stat_database_deadlocks{namespace="witself",service="witself-postgresql-metrics"}[10m])) > 0
        labels:
          severity: warning
          service: witself-postgresql
          witself_alert: "true"
        annotations:
          summary: PostgreSQL detected a deadlock in the last ten minutes.
          runbook: docs/observability-and-operations.md#postgresql-alerts
      - alert: WitselfPostgreSQLExporterUnavailable
        expr: absent(pg_up{namespace="witself",service="witself-postgresql-metrics"}) or min by (namespace, job, instance) (pg_up{namespace="witself",service="witself-postgresql-metrics"}) == 0
        for: 10m
        labels:
          severity: critical
          service: witself-postgresql
          witself_alert: "true"
        annotations:
          summary: PostgreSQL exporter metrics are absent or cannot connect to the database.
          runbook: docs/observability-and-operations.md#postgresql-alerts
      - alert: WitselfPostgreSQLDown
        expr: min by (namespace, job, instance) (pg_up{namespace="witself",service="witself-postgresql-metrics"}) == 0
        for: 5m
        labels:
          severity: critical
          service: witself-postgresql
          witself_alert: "true"
        annotations:
          summary: PostgreSQL exporter cannot connect to the database.
          runbook: docs/observability-and-operations.md#postgresql-alerts
  - name: witself-postgresql-capacity
    interval: 30s
    rules:
      - alert: WitselfPostgreSQLOOMKilled
        expr: max by (namespace, pod) ((kube_pod_container_status_last_terminated_reason{job="kube-state-metrics",namespace="witself",container="postgresql",reason="OOMKilled"} == 1) and on (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{job="kube-state-metrics",namespace="witself",container="postgresql"}[30m]) > 0))
        for: 0m
        keep_firing_for: 5m
        labels:
          severity: critical
          service: witself-postgresql
          witself_alert: "true"
        annotations:
          summary: The PostgreSQL container was OOM-killed and restarted within the last 30 minutes.
          description: kube-state-metrics reports OOMKilled as the PostgreSQL container's last termination reason and its restart count rose within 30 minutes. Both witself-server replicas lose the database while PostgreSQL restarts. Check WitselfPostgreSQLMemoryNearLimit and the cell's apps.civoPostgres.resourcesPreset.
          runbook: docs/observability-and-operations.md#postgresql-alerts
      - alert: WitselfPostgreSQLRestarted
        expr: max by (namespace, pod) ((increase(kube_pod_container_status_restarts_total{job="kube-state-metrics",namespace="witself",container="postgresql"}[30m]) > 0) unless on (namespace, pod, container) ((last_over_time(kube_pod_container_status_last_terminated_reason{job="kube-state-metrics",namespace="witself",container="postgresql",reason="OOMKilled"}[30m]) == 1) unless on (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{job="kube-state-metrics",namespace="witself",container="postgresql",reason!="OOMKilled"} == 1)))
        for: 0m
        keep_firing_for: 5m
        labels:
          severity: critical
          service: witself-postgresql
          witself_alert: "true"
        annotations:
          summary: The PostgreSQL container restarted for a reason other than an OOM kill within the last 30 minutes.
          description: kube-state-metrics reports that the PostgreSQL container's restart count rose within 30 minutes and its last termination reason is not OOMKilled. Both witself-server replicas lose the database while PostgreSQL restarts. Check the pod's restartCount and lastState and the previous container's termination lines.
          runbook: docs/observability-and-operations.md#postgresql-alerts
      - alert: WitselfPostgreSQLVolumeFillingUp
        expr: max by (namespace, persistentvolumeclaim) (predict_linear(kubelet_volume_stats_available_bytes{namespace="witself",persistentvolumeclaim=~".*postgresql.*"}[24h], 7 * 24 * 3600)) < 0
        for: 1h
        labels:
          severity: warning
          service: postgres-storage
          witself_alert: "true"
        annotations:
          summary: The PostgreSQL volume is predicted to fill within 7 days at its 24-hour trend.
          runbook: docs/observability-and-operations.md#postgresql-alerts
