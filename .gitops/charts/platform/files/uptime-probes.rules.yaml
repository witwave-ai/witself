groups:
  - name: witself-uptime-probes
    interval: 30s
    rules:
      - alert: WitselfProbeTargetDown
        # Bridge brief scrape gaps without retaining observations beyond five minutes.
        expr: last_over_time(witself_probe_up[5m]) == 0
        for: 10m
        labels:
          severity: critical
          service: synthetic-probes
          witself_alert: "true"
        annotations:
          summary: 'Synthetic uptime probe failed for {{ $labels.target }}.'
          runbook: docs/observability-and-operations.md#synthetic-uptime-probes
      - alert: WitselfProbeStale
        # Bridge brief scrape gaps: a frozen timestamp must keep ageing, not reset the pending alert.
        expr: time() - last_over_time(witself_probe_last_check_timestamp_seconds[5m]) > 900
        for: 10m
        labels:
          severity: warning
          service: synthetic-probes
          witself_alert: "true"
        annotations:
          summary: 'Synthetic uptime probe has no recent check for {{ $labels.target }}.'
          runbook: docs/observability-and-operations.md#synthetic-uptime-probes
      - alert: WitselfProbeScrapeDown
        expr: up{job="witself-probes"} == 0
        for: 15m
        labels:
          severity: critical
          service: synthetic-probes
          witself_alert: "true"
        annotations:
          summary: The control-plane synthetic uptime metrics endpoint is unreachable from the cell.
          runbook: docs/observability-and-operations.md#synthetic-uptime-probes
      - alert: WitselfProbeSchedulerStale
        # Same bounded lookback so intermittent scrape failures cannot hide a stopped scheduler.
        expr: time() - last_over_time(witself_probe_scheduler_last_run_timestamp_seconds[5m]) > 900
        for: 10m
        labels:
          severity: critical
          service: synthetic-probes
          witself_alert: "true"
        annotations:
          summary: The synthetic uptime probe scheduler has no recent run.
          runbook: docs/observability-and-operations.md#synthetic-uptime-probes
      - alert: WitselfProbeDirectoryUnavailable
        expr: witself_probe_directory_ok == 0
        for: 15m
        labels:
          severity: warning
          service: synthetic-probes
          witself_alert: "true"
        annotations:
          summary: The synthetic uptime probe scheduler cannot read the cell directory.
          runbook: docs/observability-and-operations.md#synthetic-uptime-probes
      - alert: WitselfProbeResultsMissing
        # absent() has no scrape labels; match it explicitly to the scheduler.
        expr: (witself_probe_scheduler_target_count > 0 and witself_probe_snapshot_target_count == 0) or (witself_probe_scheduler_target_count > 0 and on() absent(witself_probe_up))
        for: 15m
        labels:
          severity: critical
          service: synthetic-probes
          witself_alert: "true"
        annotations:
          summary: The scheduler reports registered targets but no probe results are exposed (persistence failure or stalled writes).
          runbook: docs/observability-and-operations.md#synthetic-uptime-probes
      - alert: WitselfProbeNoTargets
        expr: witself_probe_scheduler_target_count == 0
        for: 30m
        labels:
          severity: warning
          service: synthetic-probes
          witself_alert: "true"
        annotations:
          summary: The synthetic uptime probe scheduler has no cell targets.
          runbook: docs/observability-and-operations.md#synthetic-uptime-probes
      - alert: WitselfProbeBudgetExhausted
        expr: sum(witself_probe_skipped) > 0
        for: 15m
        labels:
          severity: warning
          service: synthetic-probes
          witself_alert: "true"
        annotations:
          summary: Synthetic uptime probes are being skipped because the run budget is exhausted.
          runbook: docs/observability-and-operations.md#synthetic-uptime-probes
      - alert: WitselfStripeWebhookRejections
        # More than nine rejected webhook requests per fifteen minutes, sustained.
        expr: sum(rate(witself_cp_stripe_webhook_events_total{outcome="rejected"}[15m])) > 0.01
        for: 5m
        labels:
          severity: critical
          service: control-plane-stripe
          witself_alert: "true"
        annotations:
          summary: The control-plane Stripe webhook rejection rate is elevated.
          runbook: docs/observability-and-operations.md#synthetic-uptime-probes
      - alert: WitselfBillingReconciliationStalled
        # Age alone is insufficient: require recent failed reconciliation attempts.
        expr: witself_cp_billing_reconciliation_lag_seconds > 900 and increase(witself_cp_billing_reconciliation_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
          service: control-plane-stripe
          witself_alert: "true"
        annotations:
          summary: The control-plane billing reconciliation backlog is over fifteen minutes old and reconciliation is failing.
          runbook: docs/observability-and-operations.md#synthetic-uptime-probes
      - alert: WitselfStripeWebhookProcessingFailures
        # Fires while three or more verified deliveries failed to fold within
        # the trailing six hours. One or two can be a receipt-lease race or a
        # transient store error that Stripe's redelivery repairs. Clears once
        # fewer than three remain in the window: six hours after the earliest
        # of them, if no more failures arrive.
        expr: sum(increase(witself_cp_stripe_webhook_events_total{outcome="processing_failed"}[6h])) >= 3
        for: 5m
        labels:
          severity: warning
          service: control-plane-stripe
          witself_alert: "true"
        annotations:
          summary: Verified Stripe webhook deliveries are failing to fold into billing state.
          runbook: docs/runbooks.md#billing-failure-alerts
      - alert: WitselfBillingMutationRecoveryFailing
        # Ten of about twelve hourly lifecycle batches failed. When a backlog
        # older than 900 seconds is known, WitselfBillingReconciliationStalled
        # pages instead. As a young backlog ages past 900 seconds this alert
        # resolves and Stalled opens: treat both as one incident.
        # Require the batch series to remain live: retained range samples
        # must not page after rollback or scrape loss makes lag stale.
        expr: |
          (increase(witself_cp_billing_mutation_batch_failures_total[1h]) >= 10)
            and on(job, instance) witself_cp_billing_mutation_batch_failures_total
            unless on(job, instance) (witself_cp_billing_reconciliation_lag_seconds > 900)
        for: 5m
        labels:
          severity: critical
          service: control-plane-stripe
          witself_alert: "true"
        annotations:
          summary: Billing-mutation recovery batches keep failing and no old backlog is observed.
          runbook: docs/runbooks.md#billing-failure-alerts
      - alert: WitselfSignupGlobalQuotaDenied
        # Any global denial means the open-signup daily ceiling is exhausted.
        expr: sum by (job, instance) (increase(witself_signup_denials_total{job="witself-probes",reason="quota_global"}[15m])) > 0
        labels:
          severity: warning
          service: control-plane-signup
          witself_alert: "true"
        annotations:
          summary: The open-signup global daily quota denied at least one signup in the last 15 minutes.
          runbook: docs/runbooks.md#signup-funnel-alerts
      - alert: WitselfSignupProvisioningFailureRatioHigh
        # The minimum-count term uses the raw in-window difference; increase() extrapolates on young series.
        expr: |
          (sum by (job, instance) (increase(witself_signup_events_total{job="witself-probes",event="provision_failed"}[30m]))
            / sum by (job, instance) (increase(witself_signup_events_total{job="witself-probes",event=~"provision_failed|provisioned"}[30m]))) > 0.2
          and sum by (job, instance) (max_over_time(witself_signup_events_total{job="witself-probes",event="provision_failed"}[30m])
            - min_over_time(witself_signup_events_total{job="witself-probes",event="provision_failed"}[30m])) >= 3
        for: 5m
        labels:
          severity: warning
          service: control-plane-signup
          witself_alert: "true"
        annotations:
          summary: More than 20% of signup provisioning attempts failed over 30 minutes (at least three failures).
          runbook: docs/runbooks.md#signup-funnel-alerts
      - alert: WitselfVerificationEmailFailureRatioHigh
        expr: |
          (sum by (job, instance) (increase(witself_signup_verification_email_total{job="witself-probes",outcome="failed"}[30m]))
            / sum by (job, instance) (increase(witself_signup_verification_email_total{job="witself-probes"}[30m]))) > 0.2
          and sum by (job, instance) (max_over_time(witself_signup_verification_email_total{job="witself-probes",outcome="failed"}[30m])
            - min_over_time(witself_signup_verification_email_total{job="witself-probes",outcome="failed"}[30m])) >= 2
        for: 5m
        labels:
          severity: warning
          service: control-plane-signup
          witself_alert: "true"
        annotations:
          summary: More than 20% of verification email sends failed over 30 minutes (at least two failures).
          runbook: docs/runbooks.md#signup-funnel-alerts
      - alert: WitselfSignupMetricsUnavailable
        expr: |
          ((max_over_time(up{job="witself-probes"}[5m]) == 1)
            unless on(job, instance) (last_over_time(witself_signup_metrics_up{job="witself-probes"}[5m]) == 1))
          or
          ((time() - last_over_time(witself_signup_observed_timestamp_seconds{job="witself-probes"}[5m]) > 1800)
            and on(job, instance) (last_over_time(witself_signup_metrics_up{job="witself-probes"}[5m]) == 1))
        for: 15m
        labels:
          severity: warning
          service: control-plane-signup
          witself_alert: "true"
        annotations:
          summary: Signup funnel observations are missing, invalid or older than 30 minutes for a control-plane scrape target.
          runbook: docs/runbooks.md#signup-funnel-alerts
