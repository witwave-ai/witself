groups:
  - name: witself-founder-open-plane
    interval: 30s
    rules:
      - alert: WitselfServerMetricsUnavailable
        expr: absent(witself_up) or max(witself_up) < 1
        for: 3m
        labels:
          severity: critical
          service: witself-server
          witself_alert: "true"
        annotations:
          summary: Witself server metrics are unavailable.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfWorkerMetricsUnavailable
        expr: absent(witself_worker_up) or max(witself_worker_up) < 1
        for: 3m
        labels:
          severity: critical
          service: witself-worker
          witself_alert: "true"
        annotations:
          summary: Witself worker metrics are unavailable.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfServerHighErrorRatio
        expr: (sum(rate(witself_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(witself_http_requests_total[5m])), 0.001)) > 0.05 and sum(rate(witself_http_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          service: witself-server
          witself_alert: "true"
        annotations:
          summary: Witself server responses exceed the bounded 5xx ratio.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfWorkerJobStopped
        expr: max by (job) (witself_worker_job_running) < 1
        for: 5m
        labels:
          severity: critical
          service: witself-worker
          witself_alert: "true"
        annotations:
          summary: A closed-set Witself worker job is not running.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfWorkerJobFailures
        expr: sum by (job) (increase(witself_worker_job_failures_total[10m])) > 0
        for: 2m
        labels:
          severity: warning
          service: witself-worker
          witself_alert: "true"
        annotations:
          summary: A closed-set Witself worker job reports recoverable failures.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfAgentEmailOutboundStale
        expr: (time() - max(witself_worker_agent_email_outbound_last_success_timestamp_seconds) > 600) or (sum(absent(witself_worker_agent_email_outbound_last_success_timestamp_seconds)) > 0)
        for: 5m
        labels:
          severity: critical
          service: agent-email-outbound
          witself_alert: "true"
        annotations:
          summary: Agent-email outbound processing has no recent successful batch.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfAgentEmailRetentionStale
        expr: (time() - max(witself_worker_agent_email_retention_last_success_timestamp_seconds{mode="enforce"}) > 600) or (sum(absent(witself_worker_agent_email_retention_last_success_timestamp_seconds{mode="enforce"})) > 0)
        for: 5m
        labels:
          severity: warning
          service: agent-email-retention
          witself_alert: "true"
        annotations:
          summary: Agent-email retention has no recent successful enforce batch.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfAgentEmailStorageLedgerUnavailable
        expr: absent(witself_agent_email_cell_storage_metrics_up) or max(witself_agent_email_cell_storage_metrics_up) < 1 or absent(witself_agent_email_cell_storage_retained_bytes) or absent(witself_agent_email_cell_storage_admission_bytes) or absent(witself_agent_email_cell_storage_hard_bytes) or absent(witself_agent_email_cell_storage_root_rows) or absent(witself_agent_email_cell_storage_admission_root_rows) or absent(witself_agent_email_cell_storage_counted_rows) or absent(witself_agent_email_cell_storage_hard_counted_rows)
        for: 3m
        labels:
          severity: critical
          service: agent-email-storage
          witself_alert: "true"
        annotations:
          summary: The schema-91 agent-email storage ledger cannot be read.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfAgentEmailStorageApproachingAdmission
        expr: (max(witself_agent_email_cell_storage_retained_bytes) / clamp_min(max(witself_agent_email_cell_storage_admission_bytes), 1) >= 0.8) or (max(witself_agent_email_cell_storage_retained_bytes) / clamp_min(max(witself_agent_email_cell_storage_hard_bytes), 1) >= 0.8) or (max(witself_agent_email_cell_storage_root_rows) / clamp_min(max(witself_agent_email_cell_storage_admission_root_rows), 1) >= 0.8) or (max(witself_agent_email_cell_storage_counted_rows) / clamp_min(max(witself_agent_email_cell_storage_hard_counted_rows), 1) >= 0.8)
        for: 15m
        labels:
          severity: warning
          service: agent-email-storage
          witself_alert: "true"
        annotations:
          summary: Agent-email logical storage is at or above 80 percent of a protective boundary.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfPostgresPVCMetricsUnavailable
        expr: sum(absent(kubelet_volume_stats_capacity_bytes{namespace="witself",persistentvolumeclaim=~".*postgresql.*"})) or sum(absent(kubelet_volume_stats_available_bytes{namespace="witself",persistentvolumeclaim=~".*postgresql.*"})) or count(kubelet_volume_stats_capacity_bytes{namespace="witself",persistentvolumeclaim=~".*postgresql.*"} unless on (namespace, persistentvolumeclaim) kubelet_volume_stats_available_bytes{namespace="witself",persistentvolumeclaim=~".*postgresql.*"}) > 0 or count(kubelet_volume_stats_available_bytes{namespace="witself",persistentvolumeclaim=~".*postgresql.*"} unless on (namespace, persistentvolumeclaim) kubelet_volume_stats_capacity_bytes{namespace="witself",persistentvolumeclaim=~".*postgresql.*"}) > 0
        for: 10m
        labels:
          severity: critical
          service: postgres-storage
          witself_alert: "true"
        annotations:
          summary: PostgreSQL PVC capacity metrics are unavailable.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfPostgresPVCApproachingCapacity
        expr: max((1 - (kubelet_volume_stats_available_bytes{namespace="witself",persistentvolumeclaim=~".*postgresql.*"} / clamp_min(kubelet_volume_stats_capacity_bytes{namespace="witself",persistentvolumeclaim=~".*postgresql.*"}, 1))) and on (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="witself",persistentvolumeclaim=~".*postgresql.*"} > 0)) >= 0.8
        for: 15m
        labels:
          severity: critical
          service: postgres-storage
          witself_alert: "true"
        annotations:
          summary: PostgreSQL PVC usage is at or above 80 percent.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfPrometheusRuleEvaluationFailures
        expr: sum(increase(prometheus_rule_evaluation_failures_total[10m])) > 0
        for: 2m
        labels:
          severity: critical
          service: monitoring
          witself_alert: "true"
        annotations:
          summary: Prometheus reports rule-evaluation failures.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfSupportFirstResponseBreach
        expr: max(witself_support_oldest_unanswered_seconds) > 86400
        for: 15m
        labels:
          severity: critical
          service: witself-server
          witself_alert: "true"
        annotations:
          summary: A support ticket has waited over 24h for its first response — the published promise is one business day.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      # Dead-man's switch. This alert always fires; it is routed only to the
      # external heartbeat receiver and deliberately carries no witself_alert
      # label, so it never reaches the incident route. Silence here means the
      # alerting pipeline itself is down, and the heartbeat monitor pages.
      - alert: WitselfWatchdog
        expr: vector(1)
        for: 0m
        labels:
          severity: none
          service: monitoring
          witself_watchdog: "true"
        annotations:
          summary: Witself alerting pipeline heartbeat.
          runbook: docs/runbooks.md#founder-open-plane-monitoring

  - name: witself-transcript-capture
    interval: 30s
    rules:
      - alert: WitselfTranscriptEntriesBatchRejectionRatioHigh
        expr: (sum(rate(witself_http_requests_total{method="POST",route="/v1/transcripts/{transcript}/entries:batch",status_class=~"4xx|5xx"}[5m])) / clamp_min(sum(rate(witself_http_requests_total{method="POST",route="/v1/transcripts/{transcript}/entries:batch"}[5m])), 0.001)) > 0.05 and sum(rate(witself_http_requests_total{method="POST",route="/v1/transcripts/{transcript}/entries:batch"}[5m])) > 0.01
        for: 10m
        labels:
          severity: warning
          service: witself-server
          witself_alert: "true"
        annotations:
          summary: Transcript entries:batch responses exceed the bounded rejection ratio.
          description: More than 5 percent of transcript batch appends have returned 4xx or 5xx for 10 minutes while traffic exceeds 0.01 requests per second; inspect client payload compatibility and server errors.
          runbook: docs/runbooks.md#founder-open-plane-monitoring

  - name: witself-retention-backlog
    interval: 30s
    rules:
      - alert: WitselfTranscriptRetentionBacklogPressure
        expr: sum(increase(witself_worker_retention_items_total{mode="enforce",kind="scan_capped_batches"}[30m])) >= 3
        for: 15m
        labels:
          severity: warning
          service: transcript-retention
          witself_alert: "true"
        annotations:
          summary: Transcript retention has sustained backlog-pressure signals.
          description: At least three enforce batches hit the bounded scan cap in 30 minutes for 15 minutes; repeated scan saturation is the available server-side proxy for backlog growth, so inspect holds and worker throughput.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfMessageRetentionBacklogPressure
        expr: sum(increase(witself_worker_message_retention_items_total{mode="enforce",kind="scan_capped_batches"}[30m])) >= 3
        for: 15m
        labels:
          severity: warning
          service: message-retention
          witself_alert: "true"
        annotations:
          summary: Message retention has sustained backlog-pressure signals.
          description: At least three enforce batches hit the bounded scan cap in 30 minutes for 15 minutes; repeated scan saturation is the available server-side proxy for backlog growth, so inspect held threads and worker throughput.
          runbook: docs/runbooks.md#founder-open-plane-monitoring

  - name: witself-fact-delete
    interval: 30s
    rules:
      - alert: WitselfFactDeleteFailureRatioHigh
        expr: (sum(rate(witself_http_requests_total{method="DELETE",route=~"/v1/facts|/v1/facts/\\{fact\\}",status_class="5xx",result="error"}[15m])) / clamp_min(sum(rate(witself_http_requests_total{method="DELETE",route=~"/v1/facts|/v1/facts/\\{fact\\}"}[15m])), 0.001)) > 0.05 and sum(rate(witself_http_requests_total{method="DELETE",route=~"/v1/facts|/v1/facts/\\{fact\\}"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
          service: witself-server
          witself_alert: "true"
        annotations:
          summary: Fact delete requests exceed the bounded server-failure ratio.
          description: More than 5 percent of fact deletion previews or applies have returned 5xx for 5 minutes; inspect the fact store, audit writes, and deletion transaction failures.
          runbook: docs/runbooks.md#founder-open-plane-monitoring

  - name: witself-avatar-generation
    interval: 30s
    rules:
      - alert: WitselfAvatarGenerationFailureRateHigh
        expr: sum(rate(witself_http_requests_total{method="POST",route="/v1/self/avatar:generation-failed",status_class="2xx",result="success"}[15m])) > 0.003
        for: 10m
        labels:
          severity: warning
          service: witself-server
          witself_alert: "true"
        annotations:
          summary: Clients are reporting a sustained avatar generation-failure rate.
          description: Successful avatar generation-failure reports have exceeded 0.003 per second for 10 minutes; inspect renderer compatibility, proposal validation, and client failure reason classes.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
  - name: witself-collectors
    interval: 30s
    rules:
      - alert: WitselfIdentityCapacityMetricsUnavailable
        expr: absent(witself_identity_capacity_metrics_up) or max(witself_identity_capacity_metrics_up) < 1
        for: 3m
        labels:
          severity: critical
          service: identity
          witself_alert: "true"
        annotations:
          summary: Identity-capacity metrics are unavailable.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfIdentityCapacityAtLimit
        expr: max(witself_identity_capacity_accounts_at_limit) > 0
        for: 30m
        labels:
          severity: warning
          service: identity
          witself_alert: "true"
        annotations:
          summary: Accounts are blocked from creating identities by a finite capacity limit.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfAuditAppendMetricsUnavailable
        expr: absent(witself_audit_append_metrics_up{container="witself-server"}) or absent(witself_audit_append_metrics_up{container="witself-worker"}) or min(witself_audit_append_metrics_up) < 1 or count((witself_up or witself_worker_up) unless on (namespace, pod, container) witself_audit_append_metrics_up) > 0
        for: 3m
        labels:
          severity: critical
          service: audit
          witself_alert: "true"
        annotations:
          summary: Audit-append metrics are unavailable.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
      - alert: WitselfAuditAppendFailures
        # A new process can fail before its first scrape. Include its nonzero
        # counters until that same series has a ten-minute-old observation;
        # compare before summing so another replica cannot hide the new one.
        expr: >-
          sum(increase(witself_audit_append_total{result="error",reason="error"}[10m])) > 0
          or sum(increase(witself_audit_append_tx_failures_total[10m])) > 0
          or sum(witself_audit_append_total{result="error",reason="error"}
            unless witself_audit_append_total{result="error",reason="error"} offset 10m) > 0
          or sum(witself_audit_append_tx_failures_total
            unless witself_audit_append_tx_failures_total offset 10m) > 0
        for: 0m
        labels:
          severity: critical
          service: audit
          witself_alert: "true"
        annotations:
          summary: Audit appends report a database or unexpected failure.
          runbook: docs/runbooks.md#founder-open-plane-monitoring
