cell:
  name: ""
  cloud: ""
  region: ""
  domain: ""
  apiHost: ""
  tlsCertificateARN: ""

gitops:
  project: default
  repoURL: https://github.com/witwave-ai/witself
  targetRevision: main
  destinationServer: https://kubernetes.default.svc

platform:
  awsAlbIngress:
    enabled: false
    className: alb
    scheme: internet-facing
    ipAddressType: ipv4
    groupName: witself-public
    listeners:
      - protocol: HTTP
        port: 80
    certificateARNs: []
  certManager:
    enabled: true
    chartRepoURL: https://charts.jetstack.io
    chartName: cert-manager
    chartVersion: v1.20.3
    namespace: cert-manager
    enableGatewayAPI: false
    serviceAccountAnnotations: {}
    podLabels: {}
    ignoreWebhookConfigurationDifferences: false
    crds:
      enabled: true
      keep: true
  externalDNS:
    enabled: false
    chartRepoURL: https://kubernetes-sigs.github.io/external-dns/
    chartName: external-dns
    chartVersion: 1.21.1
    namespace: external-dns
    serviceAccountName: external-dns
    serviceAccountLabels: {}
    serviceAccountAnnotations: {}
    podLabels: {}
    sources:
      - ingress
    policy: sync
    registry: txt
    txtOwnerId: ""
    domainFilters: []
    interval: 1m
    provider:
      name: aws
    extraArgs: {}
    extraVolumes: []
    extraVolumeMounts: []
    azureConfig:
      enabled: false
      secretName: external-dns-azure
      tenantId: ""
      subscriptionId: ""
      resourceGroup: ""
  externalSecrets:
    enabled: true
    chartRepoURL: https://charts.external-secrets.io
    chartName: external-secrets
    chartVersion: 2.7.0
    namespace: external-secrets
    installCRDs: true
    serviceAccountName: external-secrets
    serviceAccountAnnotations: {}
    serviceAccountLabels: {}
    podLabels: {}
    storeName: aws
    secretsManagerRegion: ""
    gcpProjectID: ""
    azureVaultURL: ""
    azureServiceAccountRefName: ""
    azureServiceAccountRefNamespace: ""
  keda:
    enabled: true
    chartRepoURL: https://kedacore.github.io/charts
    chartName: keda
    chartVersion: 2.20.1
    namespace: keda
    installCRDs: true
    ignoreDeploymentResourceDifferences: false
    ignoreWebhookConfigurationDifferences: false
  metricsServer:
    enabled: true
    chartRepoURL: https://kubernetes-sigs.github.io/metrics-server/
    chartName: metrics-server
    chartVersion: 3.13.1
    namespace: kube-system
    replicas: 2
  monitoring:
    # Capability only. Keep disabled in shared defaults and enable the stack in
    # its own reviewed GitOps rollout before any application ServiceMonitor.
    # Route/rule activation is a third, separate change after targets are up.
    enabled: false
    alerting:
      enabled: false
    postgresql:
      # Enable only with the cell's Civo PostgreSQL exporter and alerting.
      enabled: false
    nodeExporter:
      enabled: false
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
    kubelet:
      cadvisor: false
    defaultRules:
      # Curated node/app/resource alerts and their minimal recording rules.
      # Alerting must also be enabled; node rules require nodeExporter.
      enabled: false
    certManager:
      # Scrape existing controller pods; no new exporter workload.
      enabled: false
    argocd:
      # Scrape existing controller, repo-server and server pods.
      enabled: false
    # Scrape the control-plane Cron Trigger's public, value-free probe results.
    # Enable only in the serving cell; Alertmanager keeps the existing receiver.
    uptimeProbes:
      enabled: false
    chartRepoURL: https://prometheus-community.github.io/helm-charts
    chartName: kube-prometheus-stack
    chartVersion: 87.6.0
    chartPackageSHA256: e8bad88c0ad0231b34314c643730ca5641f84db65d937e99a7df98133cbd9cc5
    namespace: monitoring
    releaseName: witself-monitoring
    images:
      # Multi-architecture OCI index digests resolved from the exact chart's
      # declared tags. Store bare lowercase digests here; the template adapts
      # the kube-state-metrics subchart's different sha value convention.
      prometheus: f3b6aae627d96e7ad8256cdf6de5953247735117c6f577383fadb42efeeea7bc
      alertmanager: af26fbe4dd1886ac0efd7bd55cd9027da262e105b137a376522b7c14c3626e4a
      operator: 7d9247d2351480fc74587e24681578f815f387bafb2ee7b86a852a94c4cd3774
      configReloader: 74550ba3e8bf93f47bc574231090d340ae9c01d25cd11ff74799e65f9fdb9a48
      admissionWebhookPatch: 76a2170cd0c9a7758c4ac8ac5bbe9b6f73e869a15ffb77d9f684664f7d7b96b1
      kubeStateMetrics: 85108987d044b18a098126732f98602df408888c0f7d456241f5abefb9744bc1
      nodeExporter: 0f422f62c15f154af8d8572b23d623aebfb10cec73a5c654d18f911f3f9df241
    receiver:
      # Required only when alerting.enabled is true. This immutable Secret
      # contains one HTTPS webhook URL. The URL value never enters Git or Argo
      # state; Alertmanager reads it from the mounted file.
      #
      # kind selects how the incident receiver is configured:
      #   webhook   - generic HTTPS webhook; the Secret holds the full URL and
      #               Alertmanager reads it with url_file. Keeps self-hosted and
      #               non-PagerDuty providers working unchanged.
      #   pagerduty - Alertmanager native PagerDuty Events API v2; the Secret
      #               holds only the integration (routing) key, read with
      #               routing_key_file, so firing maps to trigger and resolved
      #               maps to resolve with the alert severity carried through.
      # Either way the secret value never enters Git or Argo state.
      kind: webhook
      secretName: ""
      secretKey: url
    # Dead-man's switch. The always-firing Watchdog alert is routed here and
    # nowhere else, so an external heartbeat monitor pages when Witself stops
    # reporting. Provider-agnostic on purpose: PagerDuty's free tier has no
    # native dead-man, so this is a heartbeat endpoint (Dead Man's Snitch,
    # healthchecks.io, or equivalent) configured to page on a missed check-in.
    # Leave secretName empty to omit the route, the receiver, and the mount.
    receiverDeadman:
      secretName: ""
      secretKey: url
    prometheus:
      retention: 7d
      retentionSize: 4GB
      storage: 5Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 750m
          memory: 768Mi
    alertmanager:
      retention: 120h
      storage: 1Gi
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
    operator:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
      configReloaderResources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      admissionWebhookPatchResources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
    kubeStateMetrics:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
