{{- if .Values.platform.monitoring.enabled }}
{{- $monitoring := .Values.platform.monitoring -}}
{{- $receiver := $monitoring.receiver -}}
{{- $deadman := $monitoring.receiverDeadman -}}
{{- $platformRules := and $monitoring.alerting.enabled $monitoring.defaultRules.enabled -}}
{{- if $monitoring.alerting.enabled }}
{{- if or (gt (len $receiver.secretName) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $receiver.secretName)) -}}
{{- fail "platform.monitoring.receiver.secretName must be a valid Kubernetes Secret name when alerting is enabled; the referenced Secret must be immutable" -}}
{{- end -}}
{{- if not (regexMatch "^[A-Za-z0-9._-]{1,253}$" $receiver.secretKey) -}}
{{- fail "platform.monitoring.receiver.secretKey must be a valid Kubernetes Secret data key when alerting is enabled" -}}
{{- end -}}
{{- if not (has $receiver.kind (list "webhook" "pagerduty")) -}}
{{- fail "platform.monitoring.receiver.kind must be webhook or pagerduty" -}}
{{- end -}}
{{- if $deadman.secretName -}}
{{- if or (gt (len $deadman.secretName) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $deadman.secretName)) -}}
{{- fail "platform.monitoring.receiverDeadman.secretName must be a valid Kubernetes Secret name; the referenced Secret must be immutable" -}}
{{- end -}}
{{- if not (regexMatch "^[A-Za-z0-9._-]{1,253}$" $deadman.secretKey) -}}
{{- fail "platform.monitoring.receiverDeadman.secretKey must be a valid Kubernetes Secret data key" -}}
{{- end -}}
{{- if eq $deadman.secretName $receiver.secretName -}}
{{- fail "platform.monitoring.receiverDeadman.secretName must differ from receiver.secretName; the incident and dead-man endpoints are distinct immutable Secrets" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not (regexMatch "^[a-f0-9]{64}$" $monitoring.chartPackageSHA256) -}}
{{- fail "platform.monitoring.chartPackageSHA256 must be a lowercase SHA-256" -}}
{{- end -}}
{{- range $name, $digest := $monitoring.images -}}
{{- if not (regexMatch "^[a-f0-9]{64}$" $digest) -}}
{{- fail (printf "platform.monitoring.images.%s must be a bare lowercase SHA-256 OCI digest" $name) -}}
{{- end -}}
{{- end -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: witself-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    witself.io/chart-package-sha256: {{ $monitoring.chartPackageSHA256 | quote }}
  labels:
    witself.io/cell: {{ required "cell.name is required" .Values.cell.name | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.gitops.project | quote }}
  source:
    repoURL: {{ $monitoring.chartRepoURL | quote }}
    chart: {{ $monitoring.chartName | quote }}
    targetRevision: {{ required "platform.monitoring.chartVersion is required" $monitoring.chartVersion | quote }}
    helm:
      releaseName: {{ $monitoring.releaseName | quote }}
      values: |
        commonLabels:
          witself.io/cell: {{ required "cell.name is required" .Values.cell.name | quote }}
        # Only the reviewed groups below. k3s does not expose etcd,
        # controller-manager, scheduler or kube-proxy scrape endpoints here.
        # No version/zone, Windows, quota, HPA or generic upstream alert suite.
        defaultRules:
          create: {{ $platformRules }}
          additionalRuleLabels:
            witself_alert: "true"
          rules:
            alertmanager: false
            etcd: false
            configReloaders: false
            general: false
            k8sContainerCpuUsageSecondsTotal: false
            k8sContainerMemoryCache: false
            k8sContainerMemoryRss: false
            k8sContainerMemorySwap: false
            k8sContainerResource: false
            k8sContainerMemoryWorkingSetBytes: false
            k8sPodOwner: false
            kubeApiserverAvailability: false
            kubeApiserverBurnrate: false
            kubeApiserverHistogram: false
            kubeApiserverSlos: false
            kubeControllerManager: false
            kubelet: false
            kubeProxy: false
            kubePrometheusGeneral: false
            kubePrometheusNodeRecording: false
            kubernetesApps: {{ $platformRules }}
            kubernetesResources: {{ $platformRules }}
            kubernetesStorage: false
            kubernetesSystem: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeStateMetrics: false
            network: false
            node: false
            nodeExporterAlerting: {{ and $platformRules $monitoring.nodeExporter.enabled }}
            nodeExporterRecording: false
            prometheus: false
            prometheusOperator: false
            windows: false
          disabled:
            # kubernetesSystem is off; also pin these exclusions explicitly.
            KubeVersionMismatch: true
            KubeClientErrors: true
            KubeAPIDown: true
            KubeletDown: true
            KubeControllerManagerDown: true
            KubeSchedulerDown: true
            # Replace the upstream 85%/90% variants with the requested
            # >80%, 24-hour forecast in files/platform.rules.yaml.
            NodeFilesystemSpaceFillingUp: true
            # No RAID, bonding, systemd collectors or unrelated node alerts.
            NodeFilesystemAlmostOutOfSpace: true
            NodeFilesystemFilesFillingUp: true
            NodeFilesystemAlmostOutOfFiles: true
            NodeNetworkReceiveErrs: true
            NodeNetworkTransmitErrs: true
            NodeHighNumberConntrackEntriesUsed: true
            NodeTextFileCollectorScrapeError: true
            NodeRAIDDegraded: true
            NodeRAIDDiskFailure: true
            NodeFileDescriptorLimit: true
            NodeCPUHighUsage: true
            NodeSystemSaturation: true
            NodeDiskIOSaturation: true
            NodeSystemdServiceFailed: true
            NodeSystemdServiceCrashlooping: true
            NodeBondingDegraded: true
            # Only the five reviewed pod/deployment/statefulset alerts.
            KubeDeploymentGenerationMismatch: true
            KubeDeploymentRolloutStuck: true
            KubeStatefulSetGenerationMismatch: true
            KubeStatefulSetUpdateNotRolledOut: true
            KubeDaemonSetRolloutStuck: true
            KubeDaemonSetNotScheduled: true
            KubeDaemonSetMisScheduled: true
            KubeJobNotCompleted: true
            KubeJobFailed: true
            KubeHpaReplicasMismatch: true
            KubeHpaMaxedOut: true
            KubePdbNotEnoughHealthyPods: true
            # No quotas or throttling alert; retain only CPU/memory overcommit.
            KubeCPUQuotaOvercommit: true
            KubeMemoryQuotaOvercommit: true
            KubeQuotaAlmostFull: true
            KubeQuotaFullyUsed: true
            KubeQuotaExceeded: true
            CPUThrottlingHigh: true
        grafana:
          enabled: false
        nodeExporter:
          enabled: {{ $monitoring.nodeExporter.enabled }}
{{ if $monitoring.nodeExporter.enabled }}
        prometheus-node-exporter:
          image:
            digest: {{ printf "sha256:%s" $monitoring.images.nodeExporter | quote }}
          resources:
            {{- toYaml $monitoring.nodeExporter.resources | nindent 12 }}
{{ end }}
        kubeApiServer:
          enabled: false
        kubeControllerManager:
          enabled: false
        coreDns:
          enabled: false
        kubeDns:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubelet:
          enabled: true
          serviceMonitor:
            cAdvisor: {{ $monitoring.kubelet.cadvisor }}
{{ if not $monitoring.kubelet.cadvisor }}
            # Preserve the original trimmed stack when this extension is off.
            probes: false
            resource: false
{{ end }}
            # With cAdvisor enabled, probes/resource inherit upstream defaults.
        kubeStateMetrics:
          enabled: true
        kube-state-metrics:
          image:
            sha: {{ printf "sha256:%s" $monitoring.images.kubeStateMetrics | quote }}
          resources:
            {{- toYaml $monitoring.kubeStateMetrics.resources | nindent 12 }}
        prometheusOperator:
          admissionWebhooks:
            patch:
              image:
                sha: {{ $monitoring.images.admissionWebhookPatch | quote }}
              resources:
                {{- toYaml $monitoring.operator.admissionWebhookPatchResources | nindent 16 }}
          prometheusConfigReloader:
            image:
              sha: {{ $monitoring.images.configReloader | quote }}
            resources:
              {{- toYaml $monitoring.operator.configReloaderResources | nindent 14 }}
          resources:
            {{- toYaml $monitoring.operator.resources | nindent 12 }}
          image:
            sha: {{ $monitoring.images.operator | quote }}
        prometheus:
          ingress:
            enabled: false
          service:
            type: ClusterIP
          prometheusSpec:
            replicas: 1
{{ if $monitoring.uptimeProbes.enabled }}
            additionalScrapeConfigs:
              - job_name: witself-probes
                scheme: https
                metrics_path: /metrics/probes
                scrape_interval: 60s
                static_configs:
                  - targets:
                      - self.witwave.ai:443
{{ end }}
            retention: {{ $monitoring.prometheus.retention | quote }}
            retentionSize: {{ $monitoring.prometheus.retentionSize | quote }}
            resources:
              {{- toYaml $monitoring.prometheus.resources | nindent 14 }}
            image:
              sha: {{ $monitoring.images.prometheus | quote }}
            serviceMonitorSelector:
              matchLabels:
                release: {{ $monitoring.releaseName | quote }}
            serviceMonitorNamespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values:
                    - witself
                    - {{ $monitoring.namespace | quote }}
            podMonitorSelector:
              matchLabels:
                release: {{ $monitoring.releaseName | quote }}
            podMonitorNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ $monitoring.namespace | quote }}
            probeSelector:
              matchLabels:
                release: {{ $monitoring.releaseName | quote }}
            probeNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ $monitoring.namespace | quote }}
            scrapeConfigSelector:
              matchLabels:
                release: {{ $monitoring.releaseName | quote }}
            scrapeConfigNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ $monitoring.namespace | quote }}
            ruleSelector:
              matchLabels:
                release: {{ $monitoring.releaseName | quote }}
            ruleNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ $monitoring.namespace | quote }}
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: {{ $monitoring.prometheus.storage | quote }}
        alertmanager:
          enabled: true
          ingress:
            enabled: false
          service:
            type: ClusterIP
          networkPolicy:
            enabled: true
            policyTypes:
              - Ingress
            enableClusterRules: true
            monitoringRules:
              prometheus: true
              configReloader: true
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: "null"
              group_by:
                - alertname
                - severity
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
{{ if $monitoring.alerting.enabled }}
              routes:
                - receiver: witself-external
                  matchers:
                    - witself_alert = "true"
{{- if $deadman.secretName }}
                - receiver: witself-deadman
                  matchers:
                    - witself_watchdog = "true"
                  group_wait: 0s
                  # The group flush tick gates the repeat check: a beat is sent
                  # on the first tick where the last send is older than
                  # repeat_interval. A one-minute tick with a four-minute repeat
                  # therefore lands the beat exactly every five minutes, and a
                  # failed delivery is retried on the next tick a minute later
                  # rather than a whole beat later. Never set repeat_interval
                  # equal to group_interval: the beat silently halves.
                  group_interval: 1m
                  repeat_interval: 4m
{{- end }}
{{ else }}
              routes: []
{{ end }}
            receivers:
              - name: "null"
{{ if $monitoring.alerting.enabled }}
              - name: witself-external
{{- if eq $receiver.kind "pagerduty" }}
                pagerduty_configs:
                  - routing_key_file: /etc/alertmanager/secrets/{{ $receiver.secretName }}/{{ $receiver.secretKey }}
                    url: https://events.pagerduty.com/v2/enqueue
                    send_resolved: true
                    severity: {{ `'{{ .CommonLabels.severity }}'` }}
                    http_config:
                      follow_redirects: false
{{- else }}
                webhook_configs:
                  - url_file: /etc/alertmanager/secrets/{{ $receiver.secretName }}/{{ $receiver.secretKey }}
                    send_resolved: true
                    http_config:
                      follow_redirects: false
{{- end }}
{{- if $deadman.secretName }}
              - name: witself-deadman
                webhook_configs:
                  - url_file: /etc/alertmanager/secrets/{{ $deadman.secretName }}/{{ $deadman.secretKey }}
                    send_resolved: false
                    http_config:
                      follow_redirects: false
{{- end }}
{{ end }}
          alertmanagerSpec:
            replicas: 1
            retention: {{ $monitoring.alertmanager.retention | quote }}
            alertmanagerConfigSelector:
              matchLabels:
                release: {{ $monitoring.releaseName | quote }}
            alertmanagerConfigNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ $monitoring.namespace | quote }}
{{ if $monitoring.alerting.enabled }}
            secrets:
              - {{ $receiver.secretName | quote }}
{{- if $deadman.secretName }}
              - {{ $deadman.secretName | quote }}
{{- end }}
{{ end }}
            resources:
              {{- toYaml $monitoring.alertmanager.resources | nindent 14 }}
            image:
              sha: {{ $monitoring.images.alertmanager | quote }}
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: {{ $monitoring.alertmanager.storage | quote }}
{{ if $monitoring.alerting.enabled }}
        additionalPrometheusRulesMap:
          founder-open-plane:
{{- $founderGroups := list }}
{{- range $group := (fromYaml (.Files.Get "files/founder-open-plane.rules.yaml")).groups }}
{{- if or (ne $group.name "witself-collectors") $monitoring.collectorAlerts.enabled }}
{{- $founderGroups = append $founderGroups $group }}
{{- end }}
{{- end }}
{{ toYaml (dict "groups" $founderGroups) | nindent 12 }}{{ if and $monitoring.postgresql.enabled (eq .Values.cell.cloud "civo") (dig "civoPostgres" "enabled" false (.Values.apps | default dict)) (dig "civoPostgres" "metrics" "enabled" false (.Values.apps | default dict)) }}
          postgresql:
{{ .Files.Get "files/postgresql.rules.yaml" | nindent 12 }}{{ end }}
{{- $groups := list }}
{{- range $group := (fromYaml (.Files.Get "files/platform.rules.yaml")).groups }}
{{- if or (and $platformRules (has $group.name (list "platform-resources" "platform-storage"))) (and $platformRules $monitoring.nodeExporter.enabled (eq $group.name "platform-node")) (and $monitoring.certManager.enabled $.Values.platform.certManager.enabled (eq $group.name "platform-certificates")) (and $monitoring.argocd.enabled (eq $group.name "platform-argocd")) }}
{{- $groups = append $groups $group }}
{{- end }}
{{- end }}
{{- if $groups }}
          platform:
{{ toYaml (dict "groups" $groups) | nindent 12 }}
{{- end }}
{{ if $monitoring.uptimeProbes.enabled }}
          uptime-probes:
{{ .Files.Get "files/uptime-probes.rules.yaml" | nindent 12 }}
{{ end }}
{{ end }}
  destination:
    server: {{ .Values.gitops.destinationServer | quote }}
    namespace: {{ $monitoring.namespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
