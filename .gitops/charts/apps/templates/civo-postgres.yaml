{{- $pg := .Values.apps.civoPostgres -}}
{{- $metricsEnabled := or $pg.metrics.enabled $pg.backup.enabled -}}
{{- if and $pg.enabled (eq .Values.cell.cloud "civo") }}
{{- if and $pg.metrics.serviceMonitor.enabled (not $metricsEnabled) -}}
{{- fail "apps.civoPostgres.metrics.serviceMonitor.enabled requires apps.civoPostgres.metrics.enabled" -}}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: witself-postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    witself.io/cell: {{ required "cell.name is required" .Values.cell.name | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.gitops.project | quote }}
  source:
    repoURL: {{ $pg.chartRepoURL | quote }}
    chart: {{ $pg.chartName | quote }}
    targetRevision: {{ required "apps.civoPostgres.chartVersion is required" $pg.chartVersion | quote }}
    helm:
      releaseName: witself-postgresql
      values: |
        {{- if $pg.allowInsecureImages }}
        global:
          security:
            allowInsecureImages: true
        {{- end }}
        {{- if or $pg.image.registry $pg.image.repository $pg.image.tag $pg.image.digest }}
        image:
          {{- with $pg.image.registry }}
          registry: {{ . | quote }}
          {{- end }}
          {{- with $pg.image.repository }}
          repository: {{ . | quote }}
          {{- end }}
          {{- with $pg.image.tag }}
          tag: {{ . | quote }}
          {{- end }}
          {{- with $pg.image.digest }}
          digest: {{ . | quote }}
          {{- end }}
        {{- end }}
        auth:
          username: witself
          database: witself
          existingSecret: {{ $pg.authSecretName | quote }}
          secretKeys:
            adminPasswordKey: postgres-password
            userPasswordKey: password
        architecture: standalone
        primary:
          persistence:
            enabled: true
            size: {{ $pg.storage | quote }}
          resourcesPreset: {{ default "nano" $pg.resourcesPreset }}
          {{- if or .Values.egressPolicy.enabled (not $pg.networkPolicy.enabled) (not $pg.networkPolicy.allowExternal) }}
          networkPolicy:
            # The upstream restrictive policy retains generic client peers.
            # Disable it; strict mode supplies the same resource via extraDeploy.
            enabled: false
            allowExternal: {{ $pg.networkPolicy.allowExternal }}
          {{- end }}
        readReplicas:
          replicaCount: 0
        metrics:
          enabled: {{ $metricsEnabled }}
          {{- if $metricsEnabled }}
          {{- if $pg.backup.enabled }}
          # Reuse the existing SQL exporter; no second metrics service or PVC.
          customMetrics:
            witself_postgres_backup:
              query: |
                SELECT
                  COALESCE(EXTRACT(EPOCH FROM MAX(finished_at) FILTER (WHERE succeeded)), 0)::double precision AS last_success_timestamp_seconds,
                  COALESCE(EXTRACT(EPOCH FROM MAX(started_at)), 0)::double precision AS last_attempt_timestamp_seconds,
                  COALESCE((SELECT CASE WHEN finished_at IS NULL THEN -1 WHEN succeeded THEN 1 ELSE 0 END
                    FROM witself_ops.backup_runs ORDER BY started_at DESC LIMIT 1), -1) AS last_attempt_succeeded,
                  COUNT(*) FILTER (WHERE finished_at IS NOT NULL AND NOT succeeded) AS failures_total
                FROM witself_ops.backup_runs
              metrics:
                - last_success_timestamp_seconds:
                    usage: GAUGE
                    description: "Unix timestamp of the last completed encrypted R2 PostgreSQL backup."
                - last_attempt_timestamp_seconds:
                    usage: GAUGE
                    description: "Unix timestamp of the latest PostgreSQL backup attempt."
                - last_attempt_succeeded:
                    usage: GAUGE
                    description: "Latest PostgreSQL backup attempt: 1 succeeded, 0 failed, -1 unfinished or never attempted."
                - failures_total:
                    usage: COUNTER
                    description: "Failed PostgreSQL backup attempts."
          {{- end }}
          serviceMonitor:
            enabled: {{ $pg.metrics.serviceMonitor.enabled }}
            namespace: {{ $pg.namespace | quote }}
            interval: {{ $pg.metrics.serviceMonitor.interval | quote }}
            labels:
              {{- toYaml $pg.metrics.serviceMonitor.labels | nindent 14 }}
          {{- end }}
        {{- if or .Values.egressPolicy.enabled (and $pg.networkPolicy.enabled (not $pg.networkPolicy.allowExternal)) }}
        # Reuse the upstream policy's identity so Argo updates it in place.
        extraDeploy:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: witself-postgresql
              namespace: {{ $pg.namespace | quote }}
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: postgresql
                  app.kubernetes.io/instance: witself-postgresql
                  app.kubernetes.io/component: primary
              policyTypes:
                - Ingress
                - Egress
              egress:
                {{- if .Values.egressPolicy.enabled }}
                # The primary serves SQL; the separately selected backup Job
                # owns R2 uploads. Replies to allowed ingress are stateful.
                - to:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: kube-system
                      podSelector:
                        matchLabels:
                          k8s-app: kube-dns
                  ports:
                    - protocol: UDP
                      port: 53
                    - protocol: TCP
                      port: 53
                {{- else }}
                - {}
                {{- end }}
              ingress:
                - ports:
                    - protocol: TCP
                      port: 5432
                  from:
                    {{- if $pg.backup.enabled }}
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: {{ $pg.namespace | quote }}
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: witself-postgresql-backup
                          witself.io/cell: {{ .Values.cell.name | quote }}
                    {{- end }}
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: {{ .Values.apps.witselfServer.namespace | quote }}
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: witself-server
                          app.kubernetes.io/instance: witself-server
                          app.kubernetes.io/component: server
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: {{ .Values.apps.witselfServer.namespace | quote }}
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: witself-worker
                          app.kubernetes.io/instance: witself-server
                          app.kubernetes.io/component: worker
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: monitoring
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: prometheus
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: {{ .Values.apps.witselfServer.namespace | quote }}
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: witself-agent-email-operation
                          app.kubernetes.io/component: one-shot
                        matchExpressions:
                          - key: witself.io/agent-email-operation
                            operator: In
                            values:
                              - backfill
                              - canary-manifest
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: {{ .Values.apps.witselfServer.namespace | quote }}
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: witself-agent-email-receipt-proof
                          app.kubernetes.io/component: operator-proof
                          app.kubernetes.io/managed-by: witself-operator
                          witself.io/cell: {{ .Values.cell.name | quote }}
                {{- if $metricsEnabled }}
                - ports:
                    - protocol: TCP
                      port: 9187
                  from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: monitoring
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: prometheus
                {{- end }}
        {{- end }}
  destination:
    server: {{ .Values.gitops.destinationServer | quote }}
    namespace: {{ $pg.namespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
{{- end }}
