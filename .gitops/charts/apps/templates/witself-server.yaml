{{- if .Values.apps.witselfServer.enabled }}
{{- $bootstrap := .Values.apps.witselfServer.secrets.bootstrap -}}
{{- $db := .Values.apps.witselfServer.secrets.database -}}
{{- $bootstrapTargetName := default "witself-bootstrap" $bootstrap.targetName -}}
{{- $bootstrapMountPath := default (printf "/.witself/tokens/%s/bootstrap.token" (required "cell.name is required" .Values.cell.name)) $bootstrap.mountPath -}}
{{- $targetName := default "witself-db" $db.targetName -}}
{{- $emailPilot := .Values.apps.witselfServer.agentEmail.receivePilot -}}
{{- $emailProduction := .Values.apps.witselfServer.agentEmail.receiveProduction -}}
{{- $emailProductionAccountSecret := $emailProduction.accountIDsExistingSecret -}}
{{- $emailProductionRetryCanarySecret := $emailProduction.retryCanaryAgentIDExistingSecret -}}
{{- $emailProductionHasLiteralAccounts := gt (len $emailProduction.accountIDs) 0 -}}
{{- $emailProductionHasSecretAccounts := ne $emailProductionAccountSecret.name "" -}}
{{- $emailProductionHasSecretRetryCanary := ne $emailProductionRetryCanarySecret.name "" -}}
{{- $billingEndpoint := .Values.apps.witselfServer.billing.endpoint -}}
{{- if and $billingEndpoint (not (regexMatch "^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*(:[0-9]{1,5})?(/[A-Za-z0-9._~!$&'()*+,;=:@-]+)*/?$" $billingEndpoint)) -}}
{{- fail "apps.witselfServer.billing.endpoint must be empty or a canonical HTTPS URL without credentials, query, fragment, encoded characters, or unsafe characters" -}}
{{- end -}}
{{- $billingReady := and
      (semverCompare ">=0.0.255-0" .Values.apps.witselfServer.chartVersion)
      (semverCompare ">=0.0.255-0" .Values.apps.witselfServer.imageTag) -}}
{{- if and $billingEndpoint (not $billingReady) -}}
{{- fail "apps.witselfServer.billing.endpoint requires chart and image v0.0.255 or newer" -}}
{{- end -}}
{{- if and $billingEndpoint (ne .Values.apps.witselfServer.backendKind "managed") -}}
{{- fail "apps.witselfServer.billing.endpoint is supported only for managed cells" -}}
{{- end -}}
{{- if and $emailPilot.enabled $emailProduction.enabled -}}
{{- fail "apps.witselfServer agent-email pilot and production receive cannot both be enabled" -}}
{{- end -}}
{{- if $emailProductionHasLiteralAccounts -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction.accountIDs must remain empty; managed cells require accountIDsExistingSecret" -}}
{{- end -}}
{{- if $emailProduction.retryCanaryAgentID -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction.retryCanaryAgentID must remain empty; managed cells require retryCanaryAgentIDExistingSecret" -}}
{{- end -}}
{{- if $emailProductionHasSecretAccounts -}}
{{- if or (gt (len $emailProductionAccountSecret.name) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $emailProductionAccountSecret.name)) -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction.accountIDsExistingSecret.name must be a valid Kubernetes Secret name" -}}
{{- end -}}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" $emailProductionAccountSecret.key) -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction.accountIDsExistingSecret.key must be a valid Kubernetes Secret data key" -}}
{{- end -}}
{{- end -}}
{{- if $emailProductionHasSecretRetryCanary -}}
{{- if or (gt (len $emailProductionRetryCanarySecret.name) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $emailProductionRetryCanarySecret.name)) -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction.retryCanaryAgentIDExistingSecret.name must be a valid Kubernetes Secret name" -}}
{{- end -}}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" $emailProductionRetryCanarySecret.key) -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction.retryCanaryAgentIDExistingSecret.key must be a valid Kubernetes Secret data key" -}}
{{- end -}}
{{- if not $emailProductionHasSecretAccounts -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction.retryCanaryAgentIDExistingSecret requires accountIDsExistingSecret.name" -}}
{{- end -}}
{{- if eq $emailProductionRetryCanarySecret.name $emailProductionAccountSecret.name -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction retry-canary and account-cohort Secrets must have distinct names" -}}
{{- end -}}
{{- end -}}
{{- if $emailPilot.enabled -}}
{{- $agentCount := len $emailPilot.agentIDs -}}
{{- if or (lt $agentCount 5) (gt $agentCount 10) -}}
{{- fail "apps.witselfServer.agentEmail.receivePilot.agentIDs must contain 5-10 agent IDs when enabled" -}}
{{- end -}}
{{- $_ := required "apps.witselfServer.agentEmail.receivePilot.domain is required when enabled" $emailPilot.domain -}}
{{- $_ := required "apps.witselfServer.agentEmail.receivePilot.audience is required when enabled" $emailPilot.audience -}}
{{- $_ := required "apps.witselfServer.agentEmail.receivePilot.realmID is required when enabled" $emailPilot.realmID -}}
{{- $_ := required "apps.witselfServer.agentEmail.receivePilot.relayPublicKeysJSON is required when enabled" $emailPilot.relayPublicKeysJSON -}}
{{- $_ := required "apps.witselfServer.agentEmail.receivePilot.relayReplayWindow is required when enabled" $emailPilot.relayReplayWindow -}}
{{- if gt (len $emailPilot.acceptedLegacyDomains) 1 -}}
{{- fail "apps.witselfServer.agentEmail.receivePilot.acceptedLegacyDomains may contain at most 1 domain" -}}
{{- end -}}
{{- $seenEmailDomains := dict $emailPilot.domain true -}}
{{- range $legacyDomain := $emailPilot.acceptedLegacyDomains -}}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$" $legacyDomain) -}}
{{- fail (printf "apps.witselfServer.agentEmail.receivePilot.acceptedLegacyDomains contains invalid domain %q" $legacyDomain) -}}
{{- end -}}
{{- if hasKey $seenEmailDomains $legacyDomain -}}
{{- fail (printf "apps.witselfServer.agentEmail.receivePilot.acceptedLegacyDomains contains primary or duplicate domain %q" $legacyDomain) -}}
{{- end -}}
{{- $_ := set $seenEmailDomains $legacyDomain true -}}
{{- end -}}
{{- $seenAgentIDs := dict -}}
{{- range $agentID := $emailPilot.agentIDs -}}
{{- if not (regexMatch "^agent_[a-z2-7]{16}$" $agentID) -}}
{{- fail (printf "apps.witselfServer.agentEmail.receivePilot.agentIDs contains invalid agent ID %q" $agentID) -}}
{{- end -}}
{{- if hasKey $seenAgentIDs $agentID -}}
{{- fail (printf "apps.witselfServer.agentEmail.receivePilot.agentIDs contains duplicate agent ID %q" $agentID) -}}
{{- end -}}
{{- $_ := set $seenAgentIDs $agentID true -}}
{{- end -}}
{{- if $emailPilot.retryCanaryAgentID -}}
{{- if not (hasKey $seenAgentIDs $emailPilot.retryCanaryAgentID) -}}
{{- fail "apps.witselfServer.agentEmail.receivePilot.retryCanaryAgentID must equal one enrolled agent ID" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if $emailProduction.enabled -}}
{{- $_ := required "apps.witselfServer.agentEmail.receiveProduction.domain is required when enabled" $emailProduction.domain -}}
{{- $_ := required "apps.witselfServer.agentEmail.receiveProduction.audience is required when enabled" $emailProduction.audience -}}
{{- $_ := required "apps.witselfServer.agentEmail.receiveProduction.relayPublicKeysJSON is required when enabled" $emailProduction.relayPublicKeysJSON -}}
{{- $_ := required "apps.witselfServer.agentEmail.receiveProduction.relayReplayWindow is required when enabled" $emailProduction.relayReplayWindow -}}
{{- if not $emailProductionHasSecretAccounts -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction requires accountIDsExistingSecret.name when enabled" -}}
{{- end -}}
{{- if gt (len $emailProduction.acceptedLegacyDomains) 1 -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction.acceptedLegacyDomains may contain at most 1 domain" -}}
{{- end -}}
{{- $seenProductionDomains := dict $emailProduction.domain true -}}
{{- range $legacyDomain := $emailProduction.acceptedLegacyDomains -}}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$" $legacyDomain) -}}
{{- fail (printf "apps.witselfServer.agentEmail.receiveProduction.acceptedLegacyDomains contains invalid domain %q" $legacyDomain) -}}
{{- end -}}
{{- if hasKey $seenProductionDomains $legacyDomain -}}
{{- fail (printf "apps.witselfServer.agentEmail.receiveProduction.acceptedLegacyDomains contains primary or duplicate domain %q" $legacyDomain) -}}
{{- end -}}
{{- $_ := set $seenProductionDomains $legacyDomain true -}}
{{- end -}}
{{- $seenProductionAccounts := dict -}}
{{- range $accountID := $emailProduction.accountIDs -}}
{{- if not (regexMatch "^acc_[a-z2-7]{16}$" $accountID) -}}
{{- fail (printf "apps.witselfServer.agentEmail.receiveProduction.accountIDs contains invalid account ID %q" $accountID) -}}
{{- end -}}
{{- if hasKey $seenProductionAccounts $accountID -}}
{{- fail (printf "apps.witselfServer.agentEmail.receiveProduction.accountIDs contains duplicate account ID %q" $accountID) -}}
{{- end -}}
{{- $_ := set $seenProductionAccounts $accountID true -}}
{{- end -}}
{{- if and $emailProduction.retryCanaryAgentID (not (regexMatch "^agent_[a-z2-7]{16}$" $emailProduction.retryCanaryAgentID)) -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction.retryCanaryAgentID must be one canonical agent ID" -}}
{{- end -}}
{{- end -}}
{{- $emailOutboundReady := and
      (semverCompare ">=0.0.245-0" .Values.apps.witselfServer.chartVersion)
      (semverCompare ">=0.0.245-0" .Values.apps.witselfServer.imageTag) -}}
{{- if and .Values.apps.witselfServer.worker.agentEmailOutbound.enabled (not $emailOutboundReady) -}}
{{- fail "apps.witselfServer.worker.agentEmailOutbound requires chart and image v0.0.245 or newer" -}}
{{- end -}}
{{- $serverEmailPilot := dict "enabled" $emailPilot.enabled "domain" $emailPilot.domain "audience" $emailPilot.audience "realmID" $emailPilot.realmID "agentIDs" $emailPilot.agentIDs "retryCanaryAgentID" $emailPilot.retryCanaryAgentID "relayPublicKeysJSON" $emailPilot.relayPublicKeysJSON "relayReplayWindow" $emailPilot.relayReplayWindow -}}
{{- $emailDomainCutoverReady := and
      (semverCompare ">=0.0.232-0" .Values.apps.witselfServer.chartVersion)
      (semverCompare ">=0.0.232-0" .Values.apps.witselfServer.imageTag) -}}
{{- if $emailDomainCutoverReady -}}
{{- $_ := set $serverEmailPilot "acceptedLegacyDomains" $emailPilot.acceptedLegacyDomains -}}
{{- else -}}
{{- if and $emailPilot.enabled (gt (len $emailPilot.acceptedLegacyDomains) 0) -}}
{{- $_ := set $serverEmailPilot "domain" (first $emailPilot.acceptedLegacyDomains) -}}
{{- end -}}
{{- end -}}
{{- $serverAgentEmail := dict "receivePilot" $serverEmailPilot -}}
{{- if $emailOutboundReady -}}
{{- $_ := set $serverAgentEmail "providerEventTokenSecret" .Values.apps.witselfServer.agentEmail.providerEventTokenSecret -}}
{{- end -}}
{{- $emailProductionReady := and
      (semverCompare ">=0.0.241-0" .Values.apps.witselfServer.chartVersion)
      (semverCompare ">=0.0.241-0" .Values.apps.witselfServer.imageTag) -}}
{{- if and $emailProduction.enabled (not $emailProductionReady) -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction requires chart and image v0.0.241 or newer" -}}
{{- end -}}
{{- $emailProductionRetryCanarySecretReady := and
      (semverCompare ">=0.0.245-0" .Values.apps.witselfServer.chartVersion)
      (semverCompare ">=0.0.245-0" .Values.apps.witselfServer.imageTag) -}}
{{- if and $emailProductionHasSecretRetryCanary (not $emailProductionRetryCanarySecretReady) -}}
{{- fail "apps.witselfServer.agentEmail.receiveProduction.retryCanaryAgentIDExistingSecret requires chart and image v0.0.245 or newer" -}}
{{- end -}}
{{- if $emailProductionReady -}}
{{- $serverEmailProduction := deepCopy $emailProduction -}}
{{- if not $emailProductionRetryCanarySecretReady -}}
{{- $_ := unset $serverEmailProduction "retryCanaryAgentIDExistingSecret" -}}
{{- end -}}
{{- $_ := set $serverAgentEmail "receiveProduction" $serverEmailProduction -}}
{{- end -}}
{{- $workerValues := deepCopy .Values.apps.witselfServer.worker -}}
{{- if eq (len .Values.apps.witselfServer.worker.networkPolicy.metricsFrom) 0 -}}
{{- $_ := unset $workerValues "networkPolicy" -}}
{{- end -}}
{{- if not (semverCompare ">=0.0.224-0" .Values.apps.witselfServer.chartVersion) -}}
{{- $_ := unset $workerValues "messageRateBucketCleanup" -}}
{{- end -}}
{{- if not (semverCompare ">=0.0.226-0" .Values.apps.witselfServer.chartVersion) -}}
{{- $_ := unset $workerValues "agentEmailRateBucketCleanup" -}}
{{- end -}}
{{- if not (semverCompare ">=0.0.245-0" .Values.apps.witselfServer.chartVersion) -}}
{{- $_ := unset $workerValues "agentEmailOutbound" -}}
{{- end -}}
{{- $metricsValues := deepCopy .Values.apps.witselfServer.metrics -}}
{{- $backup := .Values.apps.witselfServer.backup -}}
{{- if and $backup.validationEnabled (not $backup.enabled) -}}
{{- fail "apps.witselfServer.backup.validationEnabled requires apps.witselfServer.backup.enabled" -}}
{{- end -}}
{{- $serverValues := dict "backend" (dict "kind" .Values.apps.witselfServer.backendKind) "cell" (dict "name" .Values.cell.name) "backup" (dict "validation" (dict "enabled" $backup.validationEnabled)) "features" (dict "factDeletion" (dict "enabled" .Values.apps.witselfServer.factDeletionEnabled)) "agentEmail" $serverAgentEmail "avatar" (dict "payloadCompaction" (dict "enabled" .Values.apps.witselfServer.avatarPayloadCompactionEnabled)) "metrics" $metricsValues "worker" $workerValues "image" (dict "tag" .Values.apps.witselfServer.imageTag) "database" (dict "existingSecret" (dict "name" $targetName "urlKey" $db.urlKey)) -}}
{{- if $billingEndpoint -}}
{{- $_ := set $serverValues "billing" (dict "endpoint" $billingEndpoint) -}}
{{- end -}}
{{- if $backup.enabled -}}
{{- $_ := set $serverValues.backup "existingSecret" (dict "name" (default "witself-provision" $backup.targetName) "tokenKey" (default "backup_token" $backup.tokenKey)) -}}
{{- end -}}
{{- $_ := set $serverValues "replicaCount" .Values.apps.witselfServer.replicaCount -}}
{{- $_ := set $serverValues "minReadySeconds" .Values.apps.witselfServer.minReadySeconds -}}
{{- $_ := set $serverValues "strategy" .Values.apps.witselfServer.strategy -}}
{{- $_ := set $serverValues "lifecycle" .Values.apps.witselfServer.lifecycle -}}
{{- $_ := set $serverValues "terminationGracePeriodSeconds" .Values.apps.witselfServer.terminationGracePeriodSeconds -}}
{{- $_ := set $serverValues "podDisruptionBudget" .Values.apps.witselfServer.podDisruptionBudget -}}
{{- $_ := set $serverValues "topologySpreadConstraints" .Values.apps.witselfServer.topologySpreadConstraints -}}
{{- if gt (len .Values.apps.witselfServer.networkPolicy.metricsFrom) 0 -}}
{{- $_ := set $serverValues "networkPolicy" (dict "enabled" true "metricsFrom" .Values.apps.witselfServer.networkPolicy.metricsFrom) -}}
{{- end -}}
{{- if and .Values.apps.witselfServer.awsAlbIngress.enabled (eq .Values.cell.cloud "aws") -}}
{{- $_ := set $serverValues "ingress" .Values.apps.witselfServer.awsAlbIngress -}}
{{- end -}}
{{- if and .Values.apps.witselfServer.gcpIngress.enabled (eq .Values.cell.cloud "gcp") -}}
{{- $gcpIngress := .Values.apps.witselfServer.gcpIngress -}}
{{- $frontendConfig := default dict $gcpIngress.frontendConfig -}}
{{- $ingressAnnotations := deepCopy $gcpIngress.annotations -}}
{{- $_ := set $ingressAnnotations "kubernetes.io/ingress.class" "gce" -}}
{{- $_ := set $ingressAnnotations "networking.gke.io/managed-certificates" (default "witself-api" $gcpIngress.managedCertificateName) -}}
{{- if $frontendConfig.enabled -}}
{{- $_ := set $ingressAnnotations "networking.gke.io/v1beta1.FrontendConfig" (default "witself-api" $frontendConfig.name) -}}
{{- end -}}
{{- if $gcpIngress.staticIPName -}}
{{- $_ := set $ingressAnnotations "kubernetes.io/ingress.global-static-ip-name" $gcpIngress.staticIPName -}}
{{- end -}}
{{- if .Values.cell.apiHost -}}
{{- $_ := set $ingressAnnotations "external-dns.alpha.kubernetes.io/hostname" .Values.cell.apiHost -}}
{{- end -}}
{{- $ingressHosts := $gcpIngress.hosts -}}
{{- if .Values.cell.apiHost -}}
{{- $ingressHosts = list (dict "host" .Values.cell.apiHost "paths" (list (dict "path" "/*" "pathType" "ImplementationSpecific"))) -}}
{{- end -}}
{{- $_ := set $serverValues "ingress" (dict "enabled" true "annotations" $ingressAnnotations "hosts" $ingressHosts "tls" (list)) -}}
{{- $_ := set $serverValues "service" (dict "annotations" (dict "cloud.google.com/backend-config" (printf "{\"ports\":{\"80\":\"%s\"}}" (default "witself-server" $gcpIngress.backendConfigName)) "cloud.google.com/neg" "{\"ingress\": true}")) -}}
{{- end -}}
{{- if and .Values.apps.witselfServer.civoIngress.enabled (eq .Values.cell.cloud "civo") -}}
{{- $civoIngress := .Values.apps.witselfServer.civoIngress -}}
{{- $apiHost := required "cell.apiHost is required for Civo ingress" .Values.cell.apiHost -}}
{{- $_ := set $serverValues "ingress" (dict
      "enabled" true
      "annotations" (dict
        "cert-manager.io/cluster-issuer" (default "letsencrypt-prod" $civoIngress.clusterIssuer)
        "kubernetes.io/ingress.class" (default "traefik" $civoIngress.className))
      "hosts" (list (dict "host" $apiHost "paths" (list (dict "path" "/" "pathType" "Prefix"))))
      "tls" (list (dict "secretName" (default "witself-api-tls" $civoIngress.tlsSecretName) "hosts" (list $apiHost)))
    ) -}}
{{- end -}}
{{- if $bootstrap.enabled -}}
{{- $_ := set $serverValues "bootstrap" (dict "tokenFile" $bootstrapMountPath "existingSecret" (dict "name" $bootstrapTargetName "tokenKey" $bootstrap.tokenKey "ttlKey" $bootstrap.ttlKey)) -}}
{{- end -}}
{{- $provision := .Values.apps.witselfServer.secrets.provision -}}
{{- if $provision.enabled -}}
{{- $_ := set $serverValues "provision" (dict "existingSecret" (dict "name" (default "witself-provision" $provision.targetName) "tokenKey" (default "token" $provision.tokenKey))) -}}
{{- end -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: witself-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    witself.io/cell: {{ required "cell.name is required" .Values.cell.name | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.gitops.project | quote }}
  source:
    repoURL: {{ .Values.apps.witselfServer.chartRepoURL | quote }}
    chart: {{ .Values.apps.witselfServer.chartName | quote }}
    targetRevision: {{ required "apps.witselfServer.chartVersion is required" .Values.apps.witselfServer.chartVersion | quote }}
    helm:
      releaseName: witself-server
      values: |
{{ toYaml $serverValues | nindent 8 }}
  destination:
    server: {{ .Values.gitops.destinationServer | quote }}
    namespace: {{ .Values.apps.witselfServer.namespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
{{- end }}
