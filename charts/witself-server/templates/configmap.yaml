{{- $emailPilot := .Values.agentEmail.receivePilot -}}
{{- $emailProduction := .Values.agentEmail.receiveProduction -}}
{{- $emailProductionAccountSecret := $emailProduction.accountIDsExistingSecret -}}
{{- $emailProductionRetryCanarySecret := $emailProduction.retryCanaryAgentIDExistingSecret -}}
{{- $emailProductionHasLiteralAccounts := gt (len $emailProduction.accountIDs) 0 -}}
{{- $emailProductionHasSecretAccounts := ne $emailProductionAccountSecret.name "" -}}
{{- $emailProductionHasSecretRetryCanary := ne $emailProductionRetryCanarySecret.name "" -}}
{{- $billingEndpoint := .Values.billing.endpoint -}}
{{- $imageTag := .Values.image.tag | default .Chart.AppVersion -}}
{{- if and .Values.backup.validation.enabled (not .Values.backup.existingSecret.name) -}}
{{- fail "backup.validation.enabled requires backup.existingSecret.name" -}}
{{- end -}}
{{- if and $billingEndpoint (not (regexMatch "^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*(:[0-9]{1,5})?(/[A-Za-z0-9._~!$&'()*+,;=:@-]+)*/?$" $billingEndpoint)) -}}
{{- fail "billing.endpoint must be empty or a canonical HTTPS URL without credentials, query, fragment, encoded characters, or unsafe characters" -}}
{{- end -}}
{{- if and $emailPilot.enabled $emailProduction.enabled -}}
{{- fail "agentEmail.receivePilot.enabled and agentEmail.receiveProduction.enabled cannot both be true" -}}
{{- end -}}
{{- if and $emailProductionHasLiteralAccounts $emailProductionHasSecretAccounts -}}
{{- fail "agentEmail.receiveProduction must use exactly one of accountIDs or accountIDsExistingSecret.name" -}}
{{- end -}}
{{- if ge (int64 .Values.agentEmail.cellStorage.admissionBytes) (int64 .Values.agentEmail.cellStorage.hardBytes) -}}
{{- fail "agentEmail.cellStorage.admissionBytes must be smaller than hardBytes" -}}
{{- end -}}
{{- if ge (int64 .Values.agentEmail.cellStorage.admissionRows) (int64 .Values.agentEmail.cellStorage.hardRows) -}}
{{- fail "agentEmail.cellStorage.admissionRows must be smaller than hardRows" -}}
{{- end -}}
{{- if and $emailProduction.retryCanaryAgentID $emailProductionHasSecretRetryCanary -}}
{{- fail "agentEmail.receiveProduction must use at most one retry-canary agent source" -}}
{{- end -}}
{{- if $emailProductionHasSecretAccounts -}}
{{- if or (gt (len $emailProductionAccountSecret.name) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $emailProductionAccountSecret.name)) -}}
{{- fail "agentEmail.receiveProduction.accountIDsExistingSecret.name must be a valid Kubernetes Secret name" -}}
{{- end -}}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" $emailProductionAccountSecret.key) -}}
{{- fail "agentEmail.receiveProduction.accountIDsExistingSecret.key must be a valid Kubernetes Secret data key" -}}
{{- end -}}
{{- if $emailProduction.retryCanaryAgentID -}}
{{- fail "agentEmail.receiveProduction.retryCanaryAgentID must be empty with accountIDsExistingSecret" -}}
{{- end -}}
{{- end -}}
{{- if $emailProductionHasSecretRetryCanary -}}
{{- if or (gt (len $emailProductionRetryCanarySecret.name) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $emailProductionRetryCanarySecret.name)) -}}
{{- fail "agentEmail.receiveProduction.retryCanaryAgentIDExistingSecret.name must be a valid Kubernetes Secret name" -}}
{{- end -}}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" $emailProductionRetryCanarySecret.key) -}}
{{- fail "agentEmail.receiveProduction.retryCanaryAgentIDExistingSecret.key must be a valid Kubernetes Secret data key" -}}
{{- end -}}
{{- if not $emailProductionHasSecretAccounts -}}
{{- fail "agentEmail.receiveProduction.retryCanaryAgentIDExistingSecret requires accountIDsExistingSecret.name" -}}
{{- end -}}
{{- if eq $emailProductionRetryCanarySecret.name $emailProductionAccountSecret.name -}}
{{- fail "agentEmail.receiveProduction retry-canary and account-cohort Secrets must have distinct names" -}}
{{- end -}}
{{- if $emailProduction.retryCanaryAgentID -}}
{{- fail "agentEmail.receiveProduction must use at most one retry-canary agent source" -}}
{{- end -}}
{{- if not (semverCompare ">=0.0.245-0" $imageTag) -}}
{{- fail "agentEmail.receiveProduction.retryCanaryAgentIDExistingSecret requires image v0.0.245 or newer" -}}
{{- end -}}
{{- end -}}
{{- if $emailPilot.enabled -}}
{{- $agentCount := len $emailPilot.agentIDs -}}
{{- if or (lt $agentCount 5) (gt $agentCount 10) -}}
{{- fail "agentEmail.receivePilot.agentIDs must contain 5-10 agent IDs when enabled" -}}
{{- end -}}
{{- $_ := required "agentEmail.receivePilot.domain is required when enabled" $emailPilot.domain -}}
{{- $_ := required "agentEmail.receivePilot.audience is required when enabled" $emailPilot.audience -}}
{{- $_ := required "agentEmail.receivePilot.realmID is required when enabled" $emailPilot.realmID -}}
{{- $_ := required "agentEmail.receivePilot.relayPublicKeysJSON is required when enabled" $emailPilot.relayPublicKeysJSON -}}
{{- $_ := required "agentEmail.receivePilot.relayReplayWindow is required when enabled" $emailPilot.relayReplayWindow -}}
{{- if gt (len $emailPilot.acceptedLegacyDomains) 1 -}}
{{- fail "agentEmail.receivePilot.acceptedLegacyDomains may contain at most 1 domain" -}}
{{- end -}}
{{- $seenEmailDomains := dict $emailPilot.domain true -}}
{{- range $legacyDomain := $emailPilot.acceptedLegacyDomains -}}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$" $legacyDomain) -}}
{{- fail (printf "agentEmail.receivePilot.acceptedLegacyDomains contains invalid domain %q" $legacyDomain) -}}
{{- end -}}
{{- if hasKey $seenEmailDomains $legacyDomain -}}
{{- fail (printf "agentEmail.receivePilot.acceptedLegacyDomains contains primary or duplicate domain %q" $legacyDomain) -}}
{{- end -}}
{{- $_ := set $seenEmailDomains $legacyDomain true -}}
{{- end -}}
{{- $seenAgentIDs := dict -}}
{{- range $agentID := $emailPilot.agentIDs -}}
{{- if not (regexMatch "^agent_[a-z2-7]{16}$" $agentID) -}}
{{- fail (printf "agentEmail.receivePilot.agentIDs contains invalid agent ID %q" $agentID) -}}
{{- end -}}
{{- if hasKey $seenAgentIDs $agentID -}}
{{- fail (printf "agentEmail.receivePilot.agentIDs contains duplicate agent ID %q" $agentID) -}}
{{- end -}}
{{- $_ := set $seenAgentIDs $agentID true -}}
{{- end -}}
{{- if $emailPilot.retryCanaryAgentID -}}
{{- if not (hasKey $seenAgentIDs $emailPilot.retryCanaryAgentID) -}}
{{- fail "agentEmail.receivePilot.retryCanaryAgentID must equal one enrolled agent ID" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if $emailProduction.enabled -}}
{{- if not (semverCompare ">=0.0.241-0" $imageTag) -}}
{{- fail "agentEmail.receiveProduction requires image v0.0.241 or newer" -}}
{{- end -}}
{{- $_ := required "agentEmail.receiveProduction.domain is required when enabled" $emailProduction.domain -}}
{{- $_ := required "agentEmail.receiveProduction.audience is required when enabled" $emailProduction.audience -}}
{{- $_ := required "agentEmail.receiveProduction.relayPublicKeysJSON is required when enabled" $emailProduction.relayPublicKeysJSON -}}
{{- $_ := required "agentEmail.receiveProduction.relayReplayWindow is required when enabled" $emailProduction.relayReplayWindow -}}
{{- if not (or $emailProductionHasLiteralAccounts $emailProductionHasSecretAccounts) -}}
{{- fail "agentEmail.receiveProduction requires exactly one of accountIDs or accountIDsExistingSecret.name when enabled" -}}
{{- end -}}
{{- if $emailProductionHasLiteralAccounts -}}
{{- $accountCount := len $emailProduction.accountIDs -}}
{{- if gt $accountCount 100 -}}
{{- fail "agentEmail.receiveProduction.accountIDs must contain 1-100 account IDs when used" -}}
{{- end -}}
{{- if ne (join "," $emailProduction.accountIDs) (join "," (sortAlpha $emailProduction.accountIDs)) -}}
{{- fail "agentEmail.receiveProduction.accountIDs must be in canonical sorted order" -}}
{{- end -}}
{{- end -}}
{{- if gt (len $emailProduction.acceptedLegacyDomains) 1 -}}
{{- fail "agentEmail.receiveProduction.acceptedLegacyDomains may contain at most 1 domain" -}}
{{- end -}}
{{- $seenProductionDomains := dict $emailProduction.domain true -}}
{{- range $legacyDomain := $emailProduction.acceptedLegacyDomains -}}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$" $legacyDomain) -}}
{{- fail (printf "agentEmail.receiveProduction.acceptedLegacyDomains contains invalid domain %q" $legacyDomain) -}}
{{- end -}}
{{- if hasKey $seenProductionDomains $legacyDomain -}}
{{- fail (printf "agentEmail.receiveProduction.acceptedLegacyDomains contains primary or duplicate domain %q" $legacyDomain) -}}
{{- end -}}
{{- $_ := set $seenProductionDomains $legacyDomain true -}}
{{- end -}}
{{- $seenAccountIDs := dict -}}
{{- range $accountID := $emailProduction.accountIDs -}}
{{- if not (regexMatch "^acc_[a-z2-7]{16}$" $accountID) -}}
{{- fail (printf "agentEmail.receiveProduction.accountIDs contains invalid account ID %q" $accountID) -}}
{{- end -}}
{{- if hasKey $seenAccountIDs $accountID -}}
{{- fail (printf "agentEmail.receiveProduction.accountIDs contains duplicate account ID %q" $accountID) -}}
{{- end -}}
{{- $_ := set $seenAccountIDs $accountID true -}}
{{- end -}}
{{- if and $emailProduction.retryCanaryAgentID (not (regexMatch "^agent_[a-z2-7]{16}$" $emailProduction.retryCanaryAgentID)) -}}
{{- fail "agentEmail.receiveProduction.retryCanaryAgentID must be one canonical agent ID" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "witself-server.fullname" . }}
  annotations:
    witself.io/server-config-checksum: {{ include "witself-server.serverConfigChecksum" . | quote }}
  labels:
    {{- include "witself-server.labels" . | nindent 4 }}
data:
  # Non-secret server config. Only values witself-server consumes today are set
  # here. Database/bootstrap/provision credentials arrive through explicit
  # Secret refs. Agent-secret AVKs remain client-custodied, so the backend has
  # no sealed-plane KMS or decrypt-key configuration. See ADR 0003.
  WITSELF_API_ADDR: ":{{ .Values.server.port }}"
  WITSELF_HEALTH_ADDR: ":{{ .Values.health.port }}"
  WITSELF_METRICS_ADDR: ":{{ .Values.metrics.port }}"
  WITSELF_BACKEND_KIND: {{ .Values.backend.kind | quote }}
  WITSELF_CELL_NAME: {{ .Values.cell.name | quote }}
{{- if $billingEndpoint }}
  WITSELF_BILLING_ENDPOINT: {{ $billingEndpoint | quote }}
{{- end }}
  WITSELF_BACKUP_VALIDATION_ENABLED: {{ .Values.backup.validation.enabled | quote }}
  WITSELF_FACT_DELETION_ENABLED: {{ .Values.features.factDeletion.enabled | quote }}
  WITSELF_AGENT_EMAIL_CELL_STORAGE_ADMISSION_BYTES: {{ printf "%d" (int64 .Values.agentEmail.cellStorage.admissionBytes) | quote }}
  WITSELF_AGENT_EMAIL_CELL_STORAGE_ADMISSION_ROWS: {{ printf "%d" (int64 .Values.agentEmail.cellStorage.admissionRows) | quote }}
  WITSELF_AGENT_EMAIL_CELL_STORAGE_HARD_BYTES: {{ printf "%d" (int64 .Values.agentEmail.cellStorage.hardBytes) | quote }}
  WITSELF_AGENT_EMAIL_CELL_STORAGE_HARD_ROWS: {{ printf "%d" (int64 .Values.agentEmail.cellStorage.hardRows) | quote }}
  WITSELF_AGENT_EMAIL_RECEIVE_PILOT_ENABLED: {{ $emailPilot.enabled | quote }}
  WITSELF_AGENT_EMAIL_RECEIVE_PRODUCTION_ENABLED: {{ $emailProduction.enabled | quote }}
{{ if $emailPilot.enabled }}
  WITSELF_AGENT_EMAIL_PILOT_DOMAIN: {{ $emailPilot.domain | quote }}
{{ if $emailPilot.acceptedLegacyDomains }}
  WITSELF_AGENT_EMAIL_ACCEPTED_LEGACY_DOMAINS: {{ join "," $emailPilot.acceptedLegacyDomains | quote }}
{{ end }}
  WITSELF_AGENT_EMAIL_PILOT_AUDIENCE: {{ $emailPilot.audience | quote }}
  WITSELF_AGENT_EMAIL_PILOT_REALM_ID: {{ $emailPilot.realmID | quote }}
  WITSELF_AGENT_EMAIL_PILOT_AGENT_IDS: {{ join "," $emailPilot.agentIDs | quote }}
  WITSELF_AGENT_EMAIL_RELAY_PUBLIC_KEYS_JSON: {{ $emailPilot.relayPublicKeysJSON | quote }}
  WITSELF_AGENT_EMAIL_RELAY_REPLAY_WINDOW: {{ $emailPilot.relayReplayWindow | quote }}
{{ if $emailPilot.retryCanaryAgentID }}
  WITSELF_AGENT_EMAIL_RETRY_CANARY_AGENT_ID: {{ $emailPilot.retryCanaryAgentID | quote }}
{{ end }}
{{ end }}
{{ if $emailProduction.enabled }}
  WITSELF_AGENT_EMAIL_RECEIVE_DOMAIN: {{ $emailProduction.domain | quote }}
{{ if $emailProduction.acceptedLegacyDomains }}
  WITSELF_AGENT_EMAIL_ACCEPTED_LEGACY_DOMAINS: {{ join "," $emailProduction.acceptedLegacyDomains | quote }}
{{ end }}
  WITSELF_AGENT_EMAIL_RECEIVE_AUDIENCE: {{ $emailProduction.audience | quote }}
{{ if $emailProductionHasLiteralAccounts }}
  WITSELF_AGENT_EMAIL_RECEIVE_ACCOUNT_IDS: {{ join "," $emailProduction.accountIDs | quote }}
{{ end }}
  WITSELF_AGENT_EMAIL_RELAY_PUBLIC_KEYS_JSON: {{ $emailProduction.relayPublicKeysJSON | quote }}
  WITSELF_AGENT_EMAIL_RELAY_REPLAY_WINDOW: {{ $emailProduction.relayReplayWindow | quote }}
{{ if $emailProduction.retryCanaryAgentID }}
  WITSELF_AGENT_EMAIL_RETRY_CANARY_AGENT_ID: {{ $emailProduction.retryCanaryAgentID | quote }}
{{ end }}
{{ end }}
  WITSELF_AVATAR_PAYLOAD_COMPACTION_ENABLED: {{ .Values.avatar.payloadCompaction.enabled | quote }}
  # Background jobs run only in the separately scalable worker Deployment.
  # Keep both legacy in-process loops explicitly disabled during mixed-version
  # rolling overlap.
  WITSELF_AVATAR_STYLE_ROLLOUT_ENABLED: "false"
  WITSELF_TRANSCRIPT_RETENTION_ENABLED: "false"
