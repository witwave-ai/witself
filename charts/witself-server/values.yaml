# Default values for the witself chart — production-safe by default: non-root,
# read-only root filesystem, metrics on, default-deny NetworkPolicy.
#
# SCOPE NOTE: this chart deploys the API and, when explicitly enabled, the
# general-purpose background worker from the same versioned image. Agent
# secrets use the client-custodied AVK model and need no backend KMS or
# sealed-plane switch: the authorized client holds the AVK and the server
# stores ciphertext only.
# There is no migration Job; each database-backed process applies embedded
# forward Goose migrations before becoming Ready. No manifest here renders
# config the process would ignore.

replicaCount: 1

# Keep a ready replica serving while a replacement becomes stable. The
# maxUnavailable: 0 default matters even for a single-replica self-hosted
# install: upgrades surge a replacement instead of intentionally dropping the
# only serving pod first.
minReadySeconds: 10
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: ghcr.io/witwave-ai/images/witself-server
  # Empty tag defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# backend.kind -> WITSELF_BACKEND_KIND. Advisory; "managed" in the cloud overlay.
backend:
  kind: self-hosted

# Managed app-of-apps deployments set this to the fleet cell directory name.
# Portable self-hosted installs may leave it empty.
cell:
  name: ""

backup:
  existingSecret:
    # Name of a Secret containing the cell's backup-only credential. Empty
    # disables both active-account snapshot export and restore validation.
    name: ""
    tokenKey: backup_token
  validation:
    # Enables the rollback-only validation endpoint. Keep this false on every
    # serving cell. A dedicated, non-routing validation cell may opt in; the
    # importer executes the full restore contract and rolls the transaction
    # back so repeated drills never leave customer data behind.
    enabled: false

features:
  factDeletion:
    # Keep off through the mandatory schema-27 compatibility rollout, then
    # through a fully converged schema-28 rollout. Enable only in a later,
    # separate release; older compiled schemas refuse to start when enabled.
    enabled: false

# Capability-limited receive-only agent-email pilot. This stays off unless one
# managed cell explicitly enrolls exactly one realm and 5-10 agents. The relay
# private key belongs only in the isolated Cloudflare Worker secret; this chart
# accepts public verification keys only.
agentEmail:
  # Token accepted only by the content-free outbound provider-event callback.
  # The managed send adapter holds the matching value as a Worker secret.
  # Empty keeps the callback route absent.
  providerEventTokenSecret:
    name: ""
    key: token
  receivePilot:
    enabled: false
    domain: ""
    # One receive-only compatibility domain. New canonical identities and
    # aliases are always minted on domain; legacy domains accept only canonical
    # local parts that were actually issued before cutover.
    acceptedLegacyDomains: []
    audience: ""
    realmID: ""
    agentIDs: []
    # Optional synthetic provider-retry proof. Keep empty until every server pod
    # runs schema-61-capable code, then select exactly one enrolled pilot agent.
    retryCanaryAgentID: ""
    relayPublicKeysJSON: ""
    relayReplayWindow: 5m
  # Production receive is a separate, exact-account cohort gate. It is
  # mutually exclusive with receivePilot and stays false in every default and
  # live values file until a reviewed staged rollout.
  receiveProduction:
    enabled: false
    domain: ""
    acceptedLegacyDomains: []
    audience: ""
    # Canonical, strictly sorted acc_* IDs. The chart and server cap this at
    # 100 accounts; no wildcard or all-accounts value exists. Portable/private
    # installs may set this literal list. Managed cells should instead use the
    # existing Secret reference below so account IDs never enter Git or the
    # rendered ConfigMap. Exactly one source is required when enabled.
    accountIDs: []
    accountIDsExistingSecret:
      name: ""
      # Exact, comma-separated, byte-sorted acc_* IDs with no whitespace or
      # trailing newline. Use an immutable, versioned Secret; replace this name
      # to roll the pods because in-place Secret data mutation is unsupported.
      # API startup applies the same 1-100 cohort validation.
      key: account_ids
    # Keep empty with accountIDsExistingSecret. Secret-backed retry-canary
    # identity is not part of v0.0.241; literal/private installs may set it
    # only when they also use literal accountIDs.
    retryCanaryAgentID: ""
    relayPublicKeysJSON: ""
    relayReplayWindow: 5m

avatar:
  payloadCompaction:
    # Phase A of a rolling schema-54 renderer-profile upgrade must remain false.
    # Enable only in a later config-only rollout after every writer runs
    # compatible code; the ConfigMap checksum then restarts all pods and reruns
    # digest backfill.
    enabled: false

# General-purpose background worker. It is disabled in the portable defaults
# because it requires a shared PostgreSQL database. Managed cells and
# self-hosted installs with database.existingSecret configured can enable it
# and scale replicaCount manually. PostgreSQL row locking coordinates replicas.
worker:
  enabled: false
  replicaCount: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  terminationGracePeriodSeconds: 30
  health:
    port: 8081
  metrics:
    port: 9090
    path: /metrics
    service:
      enabled: true
      annotations: {}
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
      relabelings: []
      metricRelabelings: []
    podMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
  probes:
    liveness:
      enabled: true
      path: /livez
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      enabled: true
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    startup:
      enabled: true
      path: /startupz
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 30
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: true
    # Sources allowed to scrape the worker metrics port. Empty = allow from any.
    metricsFrom: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  avatarStyleRollout:
    enabled: true
    batchSize: 100
    interval: 2s
    batchTimeout: 30s
  # GCRA rate buckets are ephemeral coordination state. Every worker replica
  # may run this bounded cleanup because PostgreSQL SKIP LOCKED divides rows.
  messageRateBucketCleanup:
    enabled: true
    batchSize: 10000
    interval: 1m
    batchTimeout: 10s
  # Inbound-email safety buckets are independent from inter-agent messaging.
  # Every worker replica may run the same cooperatively locked cleanup loop.
  # A scheduled sweep drains consecutive full batches until caught up or the
  # batch timeout expires.
  agentEmailRateBucketCleanup:
    enabled: true
    batchSize: 10000
    interval: 1m
    batchTimeout: 10s
  # Outbound agent email is a durable, cooperatively claimed worker job. The
  # provider credential stays at the managed edge adapter; each cell receives
  # only an Ed25519 dispatch key. Keep this disabled until the exact account
  # cohort and adapter signer ring have both been configured.
  agentEmailOutbound:
    enabled: false
    dispatchEndpoint: ""
    dispatchAudience: witself-agent-email-send
    dispatchKeyID: ""
    dispatchPrivateKeySecret:
      name: ""
      key: private-key
    batchSize: 10
    interval: 2s
    batchTimeout: 30s
    providerTimeout: 20s
  # Transcript retention is an explicit three-stage rollout:
  # disabled -> preview -> enforce. Enabling the job still defaults to preview,
  # so deletion requires both enabled: true and mode: enforce.
  transcriptRetention:
    enabled: false
    mode: preview
    batchSize: 100
    interval: 5m
    batchTimeout: 2m
  # Message retention is an independent whole-thread cleanup job. Keep it
  # disabled through the compatible cell rollout, then observe preview before
  # selecting enforce in a later config-only rollout.
  messageRetention:
    enabled: false
    mode: preview
    batchSize: 25
    interval: 5m
    batchTimeout: 2m
  # Inbound agent-email retention deletes whole stored email rows (including
  # raw MIME through the row itself) while preserving mailboxes and addresses.
  # Keep disabled through schema rollout, then observe preview before enforce.
  agentEmailRetention:
    enabled: false
    mode: preview
    batchSize: 25
    interval: 5m
    batchTimeout: 2m

database:
  existingSecret:
    # Name of a Secret containing the Postgres DSN. Empty disables DB wiring.
    name: ""
    # Key inside existingSecret.name to expose as WITSELF_DATABASE_URL.
    urlKey: dsn

bootstrap:
  # Well-known file path read by witself-server for first-operator setup.
  tokenFile: /.witself/tokens/bootstrap.token
  existingSecret:
    # Name of a Secret containing the bootstrap token. Empty disables bootstrap
    # token mounting.
    name: ""
    # Key mounted at bootstrap.tokenFile.
    tokenKey: token
    # Key exposed as WITSELF_BOOTSTRAP_TOKEN_TTL.
    ttlKey: ttl

provision:
  existingSecret:
    # Name of a Secret containing the cell's account-provisioning token, exposed
    # as WITSELF_PROVISION_TOKEN (enables POST /v1/accounts — the control-plane
    # trust link). Empty disables account provisioning: the self-hosted posture.
    name: ""
    tokenKey: token

# Container ports. The env addresses are derived as ":<port>".
server:
  port: 8080
health:
  port: 8081

metrics:
  enabled: true
  port: 9090
  path: /metrics
  service:
    enabled: true
    annotations: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []
    metricRelabelings: []
  podMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

probes:
  liveness:
    enabled: true
    path: /livez
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    enabled: true
    path: /startupz
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: witself.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Neither witself-server nor witself-worker needs Kubernetes API access.
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Default-deny ingress, opened only for the three ports. Health is always
# reachable (kubelet probes); api and metrics ingress can be narrowed with
# selectors. Egress is left open until the server gains outbound dependencies.
networkPolicy:
  enabled: true
  # Sources allowed to reach the api port. Empty = allow from any in-cluster
  # source on the api port only.
  apiFrom: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: ingress-nginx
  # Sources allowed to scrape the metrics port. Empty = allow from any.
  metricsFrom: []

# Optional native Kubernetes preStop sleep. Leave disabled for the portable
# self-hosted default. Managed ingress overlays can set this long enough for
# endpoint removal and load-balancer connection draining before SIGTERM.
lifecycle:
  preStopSleepSeconds: 0

terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
