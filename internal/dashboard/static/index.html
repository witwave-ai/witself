<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Witself Agent Console</title>
<link rel="stylesheet" href="/static/base.css">
<link id="theme-css" rel="stylesheet" href="/static/themes/console.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Witself <span>/ agent console</span></div>
  <div class="topbar-right">
    <span class="live"><span id="live-dot" class="dot"></span><span id="live-label" role="status" aria-live="polite" aria-atomic="true" title="SSE transport connection">Connecting</span></span>
    <span id="version" class="version"></span>
    <label class="theme-label">theme
      <!-- options are the embedded theme packs, filled from /api/themes -->
      <select id="theme-select"></select>
    </label>
  </div>
</header>
<div class="frame">
  <nav class="rail">
    <div class="identity">
      <button id="avatar-trigger" class="avatar-box" type="button" aria-label="Enlarge current agent portrait" aria-haspopup="dialog" aria-controls="avatar-dialog"><img id="avatar" src="/api/avatar.svg" alt="agent avatar"></button>
      <div class="identity-text">
        <div id="agent-name" class="agent-name">&hellip;</div>
        <div class="agent-meta"><span id="realm-name"></span><span class="sep">&middot;</span><span id="agent-id" class="mono"></span></div>
      </div>
    </div>
    <div class="rail-links">
    <a href="#/overview" data-nav="overview">Overview</a>
    <a href="#/transcripts" data-nav="transcripts">Transcripts</a>
    <a href="#/facts" data-nav="facts">Facts</a>
    <a href="#/memories" data-nav="memories">Memories</a>
    <a href="#/conversations" data-nav="conversations">Conversations</a>
    <a href="#/email" data-nav="email">Email</a>
    <a href="#/secrets" data-nav="secrets">Secrets</a>
    </div>
  </nav>
  <main class="main">
    <div id="source-status" class="source-status" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="breadcrumb" class="breadcrumb"></div>
    <div id="view" class="view"></div>
  </main>
</div>
<footer class="statusbar">
  <span id="status-poll">poll &mdash;</span>
  <span id="status-sse">sse idle</span>
  <span id="status-upstream" class="upstream"></span>
  <span>observational reads only</span>
  <span id="status-addr" class="mono"></span>
  <a class="legal-link" href="https://self.witwave.ai/legal" target="_blank" rel="noopener">legal</a>
</footer>
<dialog id="avatar-dialog" class="avatar-dialog" aria-label="Current agent portrait">
  <img src="/api/avatar.svg" alt="Current agent portrait enlarged">
  <button id="avatar-close" class="avatar-close" type="button" autofocus>Close portrait</button>
</dialog>
<script src="/static/app.js"></script>
</body>
</html>
